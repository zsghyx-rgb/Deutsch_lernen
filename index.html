async function bgPlay(){
  if(bgOn||bgBusy||playing){stopAll();bgBusy=false;hi();return}
  if(!cloud()){alert("息屏后继续播放需要云端语音：请先在“设置→语音发音”里配置 Azure 语音（有免费额度）。系统语音在息屏后会停止。");return}
  const L=qList();if(!L.length)return;
  const title=view==="vocab"?"生词本":((all().find(x=>x.id===cur)||{}).n||"主题");
  stopAll();bgBusy=true;hi();
  const rep=C.rp||1,zon=zhOn(),uniq=new Map();
  L.forEach(it=>{uniq.set("de|"+it.de,["de",it.de]);if(zon&&it.zh)uniq.set("zh|"+it.zh,["zh",it.zh])});
  const q=[...uniq.entries()],bufs=new Map();let done=0;
  try{
    await Promise.all([0,1,2].map(async()=>{while(q.length){const e=q.shift();bufs.set(e[0],pcmOf(await azTTS(e[1][1],e[1][0])));const c=$("#pb"),pa0=$("#pa"),tx="准备音频 "+(++done)+"/"+uniq.size;if(bgBusy){if(c)c.textContent=tx;if(pa0)pa0.textContent=tx}}}));
    if(!bgBusy)return;
    const sil=ms=>new Uint8Array(48*ms),S7=sil(700),S5=sil(500),S9=sil(900),parts=[],marks=[];let bytes=0;
    for(const it of L){
      const d=bufs.get("de|"+it.de),z=zon&&it.zh?bufs.get("zh|"+it.zh):null;
      const need=d.length*rep+S7.length*(rep-1)+(z?z.length+S5.length:0)+S9.length;
      if(bytes+need>48e6)break;
      marks.push({t:bytes/48000,i:it.i});
      for(let r=0;r<rep;r++){parts.push(d);if(r<rep-1)parts.push(S7)}
      if(z)parts.push(S5,z);
      parts.push(S9);bytes+=need;
    }
    if(marks.length<L.length)alert("音频较长，只生成了前 "+marks.length+" 项");
    ga.onended=ga.onerror=null;
    ga.src=URL.createObjectURL(wavBlob(parts,bytes));ga.playbackRate=S.sp;
    ga.ontimeupdate=()=>{let k=0;while(k+1<marks.length&&marks[k+1].t<=ga.currentTime)k++;const m=marks[k];if(m&&m.i!==curLine){curLine=m.i;hi();const el=document.getElementById("l"+m.i);if(el)el.scrollIntoView({block:"center"})}};
    ga.onended=()=>{stopAll();hi()};
    playing=true;bgOn=true;bgBusy=false;
    if("mediaSession" in navigator)try{
      navigator.mediaSession.metadata=new MediaMetadata({title:"德语学习 · 连续播放",artist:title});
      navigator.mediaSession.setActionHandler("play",()=>ga.play());
      navigator.mediaSession.setActionHandler("pause",()=>ga.pause());
      navigator.mediaSession.setActionHandler("stop",()=>{stopAll();hi()});
    }catch(e){}
    await ga.play();hi();
  }catch(e){stopAll();bgBusy=false;hi();alert("后台播放失败："+e.message)}
}

async function ask(p){

  else if(a==="addw"){const zh=$("#mz").value.trim();const hw=lkLemma||d.w;[hw,d.w].forEach(k=>{k=k.toLowerCase();if(S.vd[k])S.vd[k]=-Date.now()});const ex=S.v.find(x=>x.w.toLowerCase()===hw.toLowerCase()||x.w.toLowerCase()===d.w.toLowerCase());const extra={src:lkSrc,info:lkInfo,forms:lkForms,form:hw.toLowerCase()!==d.w.toLowerCase()?d.w+(lkForm?"（"+lkForm+"）":""):""};if(ex){ex.zh=zh;if(lkSrc)ex.src=lkSrc;if(lkLemma){ex.w=hw;Object.assign(ex,extra)}}else S.v.unshift(Object.assign({w:hw,zh,ctx:d.c,t:Date.now(),due:Date.now(),iv:0},extra));save();$("#sheet").classList.remove("show");if(view==="vocab")render()}
  else if(a==="say"){speak(d.w)}
  else if(a==="del"){if(!confirm("删除这个生词？"))return;const x=S.v.splice(+d.i,1)[0];S.vd[x.w.toLowerCase()]=Date.now();save();if(view==="vd")view="vocab";render()}
  else if(a==="rev"){view="rev";flip=false;render()}
  else if(a==="flip"){flip=true;render()}
  else if(a==="yes"){rev.iv=Math.max(1,rev.iv*2);rev.due=Date.now()+rev.iv*864e5;save();flip=false;render()}
  else if(a==="no"){rev.iv=0;rev.due=Date.now()+6e4;save();flip=false;render()}
  else if(a==="imp"){
    const raw=$("#tx").value.trim();if(!raw){alert("请先粘贴或选择文本");return}
    let ls=raw.split(/\n+/).map(s=>s.trim()).filter(Boolean);
    ls=ls.flatMap(s=>s.includes("|")?[s]:s.split(/(?<=[.!?])\s+/)).filter(Boolean).slice(0,200);
    const l=ls.map(s=>{const p=s.split("|");return[p[0].trim(),(p[1]||"").trim()]});
    const wantTr=$("#trc").checked;const rr=addToTopic($("#in").value.trim()||"我的导入 "+(S.imp.length+1),l);const id=rr.id;if(wantTr&&rr.t.l.some(p=>!p[1]&&!p[2]))translateTopic(id);if(rr.ex)alert("已有同名主题，已合并（新增 "+rr.add+" 句，重复的已跳过）");
    cur=id;view="topic";render();scrollTo(0,0)}
  else if(a==="csave"){saveCfg();syncMsg="设置已保存";paintSync();sync()}
  else if(a==="ctest"){saveCfg();b.textContent="测试中…";ask("只回复 OK").then(t=>alert("AI 可用："+t.slice(0,20))).catch(x=>alert("AI 不可用："+x.message)).finally(()=>b.textContent="测试 AI")}
  else if(a==="sync"){saveCfg();if(!C.gas)alert("请先填写 Apps Script 网址");sync()}
  else if(a==="exp"){const u=URL.createObjectURL(new Blob([JSON.stringify(payload(),null,1)],{type:"application/json"}));const l=document.createElement("a");l.href=u;l.download="deutsch-backup-"+new Date().toISOString().slice(0,10)+".json";l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
  else if(a==="wipe"){if(confirm("清除本机的主题进度、生词本和导入内容？（设置保留，云端数据不受影响）")){try{localStorage.removeItem("dl")}catch(x){}location.reload()}}
  else if(a==="tr"){translateTopic(cur);render()}
  else if(a==="tzgo"){const v=$("#zt").value.trim();if(!v)return;tzIn=v;tzRun()}
  else if(a==="tzsay"){speak(document.querySelectorAll(".rt")[d.i].value)}
  else if(a==="tzsave"){const ins=document.querySelectorAll(".rt");tzRes.l.forEach((p,i)=>{const v=ins[i].value.trim();if(v)p[0]=v});
    const sel=$("#tt").value,name=sel?S.imp.find(x=>x.id===sel).n:($("#tn").value.trim()||"我的句子");
    const r=addToTopic(name,tzRes.l,"💬");tzMsg="已保存到“"+r.t.n+"”，新增 "+r.add+" 句"+(r.add<tzRes.l.length?"（"+(tzRes.l.length-r.add)+" 句已存在，已跳过）":"")+"。";render()}
  else if(a==="edit"){edit=!edit;render()}
  else if(a==="up"||a==="dn"){const ids=all().map(x=>x.id),i=ids.indexOf(d.id),j=a==="up"?i-1:i+1;if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];S.o=ids;S.so="custom";save();render()}
  else if(a==="dt"){const t=all().find(x=>x.id===d.id),im=String(t.id).startsWith("imp");if(confirm("删除主题“"+t.n+"”？"+(im?"":"（内置主题可在设置里恢复）"))){S.del[t.id]=Date.now();if(im)S.imp=S.imp.filter(x=>x.id!==t.id);save();render()}}
  else if(a==="dl"){if(!confirm("删除这一句？"))return;const t=own();if(!t)return;t.l[+d.i][2]=1;save();render()}
  else if(a==="restore"){T.forEach(t=>{if(S.del[t.id]>0)S.del[t.id]=-Date.now()});save();alert("已恢复内置主题")}
  else if(a==="gen"){const q=$("#gt").value.trim();if(!q){alert("请先输入想学的场景");return}gq=q;gl=$("#gl").value;gn=+$("#gn").value;genRun()}
  else if(a==="gsave"){const r=addToTopic($("#gnm").value.trim()||gen.n,gen.l,"✨");gen=null;cur=r.id;view="topic";render();scrollTo(0,0);if(r.ex)alert("已有同名主题，已合并（新增 "+r.add+" 句，重复的已跳过）")}
  else if(a==="delimp"){const t=S.imp[+d.i];if(confirm("删除“"+t.n+"”？")){S.imp.splice(+d.i,1);save();render()}}
});
if("speechSynthesis" in window)speechSynthesis.getVoices();
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(C.gas)sync();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&C.gas)sync()});
</script>
</body>
