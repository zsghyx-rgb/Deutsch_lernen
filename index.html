<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>德语助手</title><meta name="theme-color" content="#1f5f8b"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f4ee;--card:#fffdf8;--tx:#23282c;--mu:#6b7378;--ln:#e2ddd0;--pr:#1f5f8b;--ok:#2e7d4f;--hl:#fff3c4;--er:#b3392f}
:root[data-t=dark]{--bg:#14191d;--card:#1c2329;--tx:#e8e6df;--mu:#98a1a7;--ln:#2d363d;--pr:#5aa6d6;--ok:#58b27a;--hl:#4a4217;--er:#e27a70}
@media(prefers-color-scheme:dark){:root[data-t=auto]{--bg:#14191d;--card:#1c2329;--tx:#e8e6df;--mu:#98a1a7;--ln:#2d363d;--pr:#5aa6d6;--ok:#58b27a;--hl:#4a4217;--er:#e27a70}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Georgia,"Noto Serif SC",serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,button,.b,nav{font-family:"Avenir Next","PingFang SC",system-ui,sans-serif}
#app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(80px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}h2{font-size:17px;margin:14px 0 6px}h3{font-size:15px;margin:10px 0 4px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0}
button{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--ln);background:var(--card);cursor:pointer}
button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button.d{color:var(--er)}button:disabled{opacity:.5;cursor:not-allowed}
button.i{min-width:40px;padding:0;border:0;background:none;color:var(--pr);display:inline-flex;align-items:center;justify-content:center}button.i:active{opacity:.5}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--card);margin:4px 0 10px}
textarea{min-height:110px;resize:vertical}label{display:block;font-size:14px;color:var(--mu);font-family:system-ui,sans-serif}
label.c{display:flex;gap:8px;align-items:center;color:var(--tx)}label.c input{width:auto;margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>.g{flex:1}
.b{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--pr);color:#fff;margin-left:6px}
.mu{color:var(--mu);font-size:14px}.hl{background:var(--hl)}
.w{cursor:pointer;border-radius:3px}.w.k{text-decoration:underline;text-decoration-color:var(--pr)}
.li{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.li .g{flex:1;min-width:0}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--ln);padding:4px 8px;text-align:left;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tp{text-align:center;cursor:pointer}.bar{height:5px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav div{max-width:640px;margin:auto;display:flex}nav button{flex:1;height:56px;border:0;border-radius:0;background:none;color:var(--mu);font-size:13px}nav button.on{color:var(--pr);font-weight:700}
#ov{position:fixed;inset:0;background:#0008;z-index:8;display:none}#sh{position:fixed;left:0;right:0;bottom:0;max-height:85vh;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;z-index:9;display:none;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:640px;margin:auto}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:20;display:flex;flex-direction:column;gap:6px}#ts div{background:#222;color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;font-family:system-ui}
</style></head><body>
<div id="app"></div><nav><div id="nv"></div></nav><div id="ov"></div><div id="sh"></div><div id="ts"></div>
<script>
'use strict';
/* ===== utils ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const rd=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('存储空间不足')}};
const dash=v=>v?esc(v):'—';
function toast(m,fn){const d=document.createElement('div');d.textContent=m;if(fn){d.style.cursor='pointer';d.onclick=fn}$('#ts').appendChild(d);setTimeout(()=>d.remove(),fn?15000:3000)}
/* ===== state & persistence ===== */
const BUILTIN={id:'b_greet',title:'日常问候',emoji:'👋',source:'builtin',lines:[{de:'Guten Morgen, wie geht es Ihnen?',zh:'早上好，您好吗？'},{de:'Ich möchte einen Kaffee bestellen.',zh:'我想点一杯咖啡。'},{de:'Entschuldigung, wo ist der Bahnhof?',zh:'打扰一下，火车站在哪里？'}]};
const DC={ai:{provider:'openai',baseUrl:'https://api.deepseek.com/v1',apiKey:'',model:'deepseek-chat'},dict:{customUrl:''},sync:{appsScriptUrl:'',token:'',interval:3},tts:{engine:'system'},theme:'auto',ui:{speechRate:.8,repeat:1,showZh:true,showMastered:true,bg:false}};
let C=rd('dl_cfg',{});for(const k of ['ai','dict','tts','ui','sync'])C[k]=Object.assign({},DC[k],C[k]);C.theme=C.theme||'auto';
let D=Object.assign({version:1,updatedAt:0,mastered:{},vocab:[],importedTopics:[BUILTIN],history:[],deleted:{},order:[],sort:'time'},rd('dl',{}));
let CACHE=rd('dl_cache',{});
const saveD=()=>{D.updatedAt=Date.now();D.dirty=1;wr('dl',D);schedSync()},saveC=()=>wr('dl_cfg',C);
const S={tq:'',tset:0,tab:0,sub:'',q:'',res:null,busy:false,vq:'',vlim:100,manage:false,tid:null,rev:null,gen:null,sel:null,playing:false,vsort:'time'};
/* ===== AI ===== */
function parseJ(t){t=String(t).replace(/```json|```/g,'');const a=t.search(/[\{\[]/),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));if(a<0||b<a)throw new Error('AI 返回格式异常，请重试');try{return JSON.parse(t.slice(a,b+1))}catch(e){throw new Error('AI 返回格式异常，请重试')}}
async function ai(user){const a=C.ai;if(!a.apiKey)throw new Error('noai');if(!navigator.onLine)throw new Error('当前离线，无法使用 AI');const sys='只输出 JSON，不要 Markdown，不要解释。';let r,j;const u=a.baseUrl.replace(/\/$/,'');
try{if(a.provider==='claude')r=await fetch(u+'/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':a.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:a.model,max_tokens:2000,system:sys,messages:[{role:'user',content:user}]})});
else r=await fetch(u+'/chat/completions',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+a.apiKey},body:JSON.stringify({model:a.model,messages:[{role:'system',content:sys},{role:'user',content:user}]})})}catch(e){throw new Error('无法连接（网络问题，或该服务不允许浏览器直接调用）')}
if(!r.ok)throw new Error('AI 服务返回错误 '+r.status);j=await r.json();return parseJ(a.provider==='claude'?j.content[0].text:j.choices[0].message.content)}
async function mm(t,from,to){if(!navigator.onLine)throw new Error('当前离线，无法翻译');try{const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(t.slice(0,450))+'&langpair='+from+'|'+to);const j=await r.json();return j.responseData.translatedText}catch(e){throw new Error('无法连接（网络问题，或该服务不允许浏览器直接调用）')}}
const hasCJK=s=>/[\u4e00-\u9fff]/.test(s);
const str=v=>typeof v==='string'?v:'',arr=v=>Array.isArray(v)?v.filter(x=>typeof x==='string'):[];
const pr=x=>{x=x||{};return{ich:str(x.ich),du:str(x.du),er:str(x.er),wir:str(x.wir),ihr:str(x.ihr),sie:str(x.sie)}};
function norm(o,w){o=o&&typeof o==='object'?o:{};const f=o.forms||{},aj=o.adjective;return{lemma:str(o.lemma)||w,pos:str(o.pos),article:str(o.article),plural:str(o.plural),genitiv:str(o.genitiv),zh:str(o.zh),explain:str(o.explain),forms:{praesens:pr(f.praesens),praeteritum:pr(f.praeteritum),perfekt:str(f.perfekt),imperativ:str(f.imperativ),partizipII:str(f.partizipII),hilfsverb:str(f.hilfsverb),konjunktivII:str(f.konjunktivII)},adjective:aj&&typeof aj==='object'?{positive:str(aj.positive),komparativ:str(aj.komparativ),superlativ:str(aj.superlativ)}:null,examples:(Array.isArray(o.examples)?o.examples:[]).filter(e=>e&&e.de).map(e=>({de:str(e.de),zh:str(e.zh)})),collocations:arr(o.collocations),pitfalls:str(o.pitfalls),synonyms:arr(o.synonyms),antonyms:arr(o.antonyms),note:str(o.note)}}
const WPROMPT=(w,c)=>'你是德语词典。查询德语单词：'+w+(c?'（上下文：'+c+'）':'')+'。输出JSON：{"lemma":"原形，名词带冠词","pos":"名词/动词/形容词/副词","article":"der|die|das或空","plural":"","genitiv":"","zh":"简明中文释义","explain":"2-5句中文解释，含用法搭配易错点","forms":{"praesens":{"ich":"","du":"","er":"","wir":"","ihr":"","sie":""},"praeteritum":{"ich":"","du":"","er":"","wir":"","ihr":"","sie":""},"perfekt":"","imperativ":"","partizipII":"","hilfsverb":"","konjunktivII":""},"adjective":{"positive":"","komparativ":"","superlativ":""},"examples":[{"de":"B1例句","zh":"翻译"}],"collocations":[],"pitfalls":"","synonyms":[],"antonyms":[],"note":""}。名词必填article/plural/genitiv，动词必填六人称，形容词填三形式，至少3条例句，不确定的留空，不要编造。';
async function lookupWord(w,ctx){const k=w+'|'+(ctx||'');if(CACHE[k])return CACHE[k];let d;try{d=norm(await ai(WPROMPT(w,ctx)),w)}catch(e){if(e.message!=='noai'&&!/无法连接|离线/.test(e.message))throw e;const z=await mm(w,'de','zh-CN');d=norm({lemma:w,zh:z},w);return d}
CACHE[k]=d;const ks=Object.keys(CACHE);if(ks.length>200)delete CACHE[ks[0]];wr('dl_cache',CACHE);return d}
async function translateLines(des){const out=[];for(let i=0;i<des.length;i+=15){const b=des.slice(i,i+15);let r;try{r=await ai('把下列德语句子翻译成中文，输出等长JSON字符串数组：'+JSON.stringify(b));if(!Array.isArray(r)||r.length!==b.length)throw 0}catch(e){r=[];for(const s of b)try{r.push(await mm(s,'de','zh-CN'))}catch(x){r.push('')}toast('AI 不可用，已降级 MyMemory，质量较低')}out.push(...r.map(str))}return out}
/* ===== TTS ===== */
let cancelPlay=false;
function sysSpeak(t,lang){return new Promise(res=>{if(!('speechSynthesis' in window)){toast('此设备不支持语音');return res()}const u=new SpeechSynthesisUtterance(t);u.lang=lang==='zh'?'zh-CN':'de-DE';if(lang!=='zh')u.rate=C.ui.speechRate;u.onend=u.onerror=()=>res();speechSynthesis.speak(u)})}
let azWarned=false,curAudio=null;
const AZDE=['de-DE-KatjaNeural','de-DE-ConradNeural','de-DE-AmalaNeural','de-DE-BerndNeural','de-DE-ChristophNeural','de-DE-ElkeNeural','de-DE-GiselaNeural','de-DE-KasperNeural','de-DE-KillianNeural','de-DE-KlarissaNeural','de-DE-KlausNeural','de-DE-LouisaNeural','de-DE-MajaNeural','de-DE-RalfNeural','de-DE-SeraphinaNeural','de-DE-TanjaNeural'];
const AZZH=['zh-CN-XiaoxiaoNeural','zh-CN-XiaoyiNeural','zh-CN-YunjianNeural','zh-CN-YunxiNeural','zh-CN-YunxiaNeural','zh-CN-YunyangNeural','zh-CN-liaoning-XiaobeiNeural','zh-CN-shaanxi-XiaoniNeural'];
async function azure(t,lang){const T=C.tts,zh=lang==='zh',voice=zh?(T.zhVoice||AZZH[0]):(T.deVoice||AZDE[0]),rate=zh?'1':String(C.ui.speechRate);
const req=new Request('https://tts.local/'+encodeURIComponent(voice+'|'+rate+'|'+t));let c=null,r=null;try{c=await caches.open('dl-tts');r=await c.match(req)}catch(e){}
if(!r){if(!navigator.onLine)throw new Error('当前离线');const ssml='<speak version="1.0" xml:lang="'+(zh?'zh-CN':'de-DE')+'"><voice name="'+esc(voice)+'"><prosody rate="'+rate+'">'+esc(t)+'</prosody></voice></speak>';
try{r=await fetch('https://'+encodeURIComponent(T.azureRegion)+'.tts.speech.microsoft.com/cognitiveservices/v1',{method:'POST',headers:{'Ocp-Apim-Subscription-Key':T.azureKey,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'riff-24khz-16bit-mono-pcm'},body:ssml})}catch(e){throw new Error('无法连接')}
if(!r.ok)throw new Error('错误 '+r.status+(r.status===401?'，Key 或区域不正确':''));if(c)try{await c.put(req,r.clone())}catch(e){}}
const url=URL.createObjectURL(await r.blob());return new Promise((res,rej)=>{const a=new Audio(url);curAudio=a;const fin=()=>{URL.revokeObjectURL(url);res()};a.onended=fin;a.onpause=fin;a.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('播放失败'))};a.play().catch(rej)})}
function speak(t,lang){const T=C.tts;if(T.engine==='azure'&&T.azureKey&&T.azureRegion)return azure(t,lang).catch(e=>{if(!azWarned){azWarned=true;toast('Azure 语音失败（'+e.message+'），已改用系统语音')}return sysSpeak(t,lang)});return sysSpeak(t,lang)}
const stopAudio=()=>{speechSynthesis.cancel();if(curAudio)curAudio.pause()};
const say=(t,l)=>{stopAudio();speak(t,l)};
async function cacheInfo(){try{const c=await caches.open('dl-tts'),ks=await c.keys();return ks.length}catch(e){return 0}}
const spk=(t,l)=>'<button class="i" data-a="say" data-t="'+esc(t)+'" data-l="'+(l||'de')+'" aria-label="发音"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>';
/* ===== vocab ===== */
function addVocab(d,ctx,form){const k=d.lemma.toLowerCase();let v=D.vocab.find(x=>x.lemma.toLowerCase()===k);const isNew=!v;if(isNew){delete D.deleted['w_'+k];v={id:uid('v_'),createdAt:Date.now(),due:Date.now(),interval:0,ease:2.5,reps:0};D.vocab.push(v)}
Object.assign(v,{word:d.lemma,lemma:d.lemma,article:d.article,plural:d.plural,genitiv:d.genitiv,pos:d.pos,zh:d.zh||v.zh||'',explain:d.explain,forms:d.forms,adjective:d.adjective,examples:d.examples,collocations:d.collocations,pitfalls:d.pitfalls,synonyms:d.synonyms,antonyms:d.antonyms,context:ctx||v.context||'',contextForm:form||v.contextForm||''});saveD();toast(isNew?'已加入生词本':'已更新')}
const known=w=>D.vocab.some(v=>v.lemma.toLowerCase()===w.toLowerCase()||(v.contextForm||'').toLowerCase()===w.toLowerCase());
const badge=d=>d.pos?'<span class="b">'+esc(d.article==='der'?'m.':d.article==='die'?'f.':d.article==='das'?'n.':{'动词':'v.','形容词':'adj.','副词':'adv.'}[d.pos]||d.pos)+'</span>':'';
function tables(d){let h='';const f=d.forms||{},p=f.praesens||{},q=f.praeteritum||{};
if(p.ich||p.du||p.er){const P=['ich','du','er','wir','ihr','sie'],L=['ich','du','er/sie/es','wir','ihr','sie/Sie'];h+='<div class="sc"><table><tr><th></th><th>现在时</th><th>过去时</th></tr>'+P.map((x,i)=>'<tr><td>'+L[i]+'</td><td>'+dash(p[x])+'</td><td>'+dash(q[x])+'</td></tr>').join('')+'</table></div><div class="sc"><table><tr><td>完成时</td><td>'+dash(f.perfekt)+'</td></tr><tr><td>命令式</td><td>'+dash(f.imperativ)+'</td></tr><tr><td>过去分词</td><td>'+dash(f.partizipII)+'</td></tr><tr><td>助动词</td><td>'+dash(f.hilfsverb)+'</td></tr><tr><td>虚拟式II</td><td>'+dash(f.konjunktivII)+'</td></tr></table></div>'}
if(d.article||d.plural)h+='<div class="sc"><table><tr><th>单数</th><th>复数</th><th>第二格</th></tr><tr><td>'+dash((d.article+' '+d.lemma.replace(/^(der|die|das) /,'')).trim())+'</td><td>'+dash(d.plural)+'</td><td>'+dash(d.genitiv)+'</td></tr></table></div>';
if(d.adjective)h+='<div class="sc"><table><tr><th>原级</th><th>比较级</th><th>最高级</th></tr><tr><td>'+dash(d.adjective.positive)+'</td><td>'+dash(d.adjective.komparativ)+'</td><td>'+dash(d.adjective.superlativ)+'</td></tr></table></div>';
return h}
const exHtml=e=>(e||[]).map(x=>'<div class="li"><div class="g">'+esc(x.de)+'<div class="mu">'+esc(x.zh)+'</div></div>'+spk(x.de)+'</div>').join('')||'<div class="mu">—</div>';
function wordCard(d){return '<div class="card"><div class="row"><h2 class="g" style="margin:0">'+esc(d.lemma)+badge(d)+'</h2>'+spk(d.lemma)+'</div><p>'+dash(d.zh)+'</p>'+(d.note?'<p class="mu">'+esc(d.note)+'</p>':'')+tables(d)+'<h3>例句</h3>'+exHtml(d.examples)+'<button class="p" data-a="addres">加入生词本</button></div>'}
const gw=s=>hasCJK(s)?esc(s):wrap(s);
const sentCard=r=>{const zh=hasCJK(r.src),single=zh&&r.out.trim().split(/\s+/).length<=3;return '<div class="card"><div class="row"><div class="g">'+gw(r.src)+'</div>'+spk(r.src,zh?'zh':'de')+'</div><hr style="border:0;border-top:1px solid var(--ln)"><div class="row"><div class="g"><b>'+gw(r.out)+'</b></div>'+spk(r.out,hasCJK(r.out)?'zh':'de')+'</div>'+(single?'<button class="p" data-a="lookup" data-w="'+esc(r.out.trim())+'" '+(S.busy?'disabled':'')+'>查看词条 / 加入生词本</button>':'<p class="mu">点击德语单词可查词并加入生词本</p>')+'</div>'};
/* ===== search / history ===== */
async function doQuery(forceWord){const q=S.q.trim();if(!q||S.busy)return;S.busy=true;render();let raw;
try{if(!forceWord&&(hasCJK(q)||/\s/.test(q)||q.length>40)){let out;const from=hasCJK(q)?'zh-CN':'de',to=hasCJK(q)?'de':'zh-CN';try{const r=await ai('把下面文本翻译成'+(to==='de'?'德语':'中文')+'，输出JSON：{"t":"译文"}。文本：'+q.slice(0,1000));out=str(r.t)}catch(e){if(e.message!=='noai'&&!/无法连接|离线/.test(e.message))throw e;out=await mm(q,from,to)}raw={type:'sentence',src:q,out:out}}
else raw={type:'word',data:await lookupWord(q)};
S.res=raw;D.history.unshift({id:uid('h_'),type:raw.type,query:q,answer:raw.type==='word'?raw.data.zh:raw.out,createdAt:Date.now(),raw:raw});D.history=D.history.slice(0,100);saveD()}catch(e){toast(e.message)}
S.busy=false;render()}
function openHist(id){const h=D.history.find(x=>x.id===id);if(!h)return;const r=h.raw;if(r&&((r.type==='word'&&r.data&&r.data.lemma)||(r.type==='sentence'&&r.out))){S.res=r;S.q=h.query;render()}else{S.q=h.query;doQuery()}}
/* ===== topics ===== */
const topics=()=>D.importedTopics.filter(t=>!D.deleted[t.id]);
function mergeTopic(t){const e=D.importedTopics.find(x=>x.title===t.title&&!D.deleted[x.id]);if(e){e.lines.push(...t.lines);toast('同名主题已合并，新增 '+t.lines.length+' 句')}else{D.importedTopics.push(t);toast('已保存，共 '+t.lines.length+' 句')}saveD()}
function parseImport(txt){const L=[];for(const raw of txt.split(/\n/)){const l=raw.trim();if(!l)continue;if(l.includes('|')){const [a,b]=l.split('|');L.push({de:a.trim(),zh:(b||'').trim(),hidden:false})}else l.split(/(?<=[.!?。！？])\s+/).forEach(s=>s.trim()&&L.push({de:s.trim(),zh:'',hidden:false}))}return L.slice(0,200)}
/* ===== views ===== */
const TABS=['🔤 翻译','📒 生词本','📚 学习','⚙️ 设置'];
const V={};
V.t0=()=>{let h='<h1>翻译 / 查词</h1><textarea id="q" placeholder="输入德语或中文" maxlength="1000">'+esc(S.q)+'</textarea><button class="p" data-a="query" '+(S.busy?'disabled':'')+'>'+(S.busy?'查询中…':'查询 / 翻译')+'</button>';
if(!navigator.onLine)h+='<p class="mu">当前离线：仅可使用已缓存与历史结果</p>';
if(S.res)h+=S.res.type==='word'?wordCard(S.res.data):sentCard(S.res);
h+='<h2 class="row"><span class="g">历史记录</span>'+(D.history.length?'<button class="d" data-a="clrhist">清空</button>':'')+'</h2>';
h+=D.history.map(x=>'<div class="li" data-a="hist" data-id="'+esc(x.id)+'" style="cursor:pointer"><div class="g"><b>'+esc(x.query.slice(0,40))+'</b><div class="mu">'+esc((x.answer||'').slice(0,50))+'</div></div></div>').join('')||'<p class="mu">暂无记录</p>';return h};
function sortedVocab(){let a=D.vocab.slice();const q=S.vq.toLowerCase();if(q)a=a.filter(v=>[v.word,v.zh,v.pos,v.contextForm,JSON.stringify(v.examples||[]),JSON.stringify(v.forms||{})].join(' ').toLowerCase().includes(q));
const s=S.vsort;a.sort((x,y)=>s==='az'?x.word.localeCompare(y.word,'de'):s==='pos'?(x.pos||'').localeCompare(y.pos||''):s==='gender'?(x.article||'z').localeCompare(y.article||'z'):y.createdAt-x.createdAt);return a}
V.t1=()=>{if(S.sub==='rev')return V.rev();if(S.sub==='vd')return V.vd();const due=D.vocab.filter(v=>v.due<=Date.now()).length,a=sortedVocab();
let h='<h1>生词本<button class="p" data-a="rev" '+(due?'':'disabled')+'>复习 '+due+'</button></h1><input id="vq" placeholder="搜索" value="'+esc(S.vq)+'"><div class="row"><select id="vs" class="g"><option value="time">添加时间</option><option value="az">字母</option><option value="pos">词类</option><option value="gender">名词性别</option></select><button data-a="mng">'+(S.manage?'完成':'管理')+'</button></div>';
h=h.replace('value="'+S.vsort+'"','value="'+S.vsort+'" selected');
h+=a.slice(0,S.vlim).map(v=>'<div class="li">'+spk(v.word)+'<div class="g" data-a="vd" data-id="'+esc(v.id)+'" style="cursor:pointer"><b>'+esc(v.word)+'</b>'+badge(v)+'<div class="mu">'+esc(v.zh)+'</div></div>'+(S.manage?'<button class="d" data-a="vdel" data-id="'+esc(v.id)+'">删除</button>':'')+'</div>').join('')||'<p class="mu">还没有生词</p>';
if(a.length>S.vlim)h+='<button data-a="more">加载更多</button>';return h};
V.vd=()=>{const v=D.vocab.find(x=>x.id===S.sel);if(!v)return'';const d=norm(v,v.word);d.lemma=v.word;d.pos=v.pos;
return '<h1><button data-a="back">‹ 返回</button></h1><div class="card"><div class="row"><h2 class="g" style="margin:0">'+esc(v.word)+badge(v)+'</h2>'+spk(v.word)+'</div><p>'+dash(v.zh)+'</p></div><div class="card"><h3>基本信息</h3><p class="mu">词性：'+dash(v.pos)+' · 冠词：'+dash(v.article)+' · 复数：'+dash(v.plural)+' · 第二格：'+dash(v.genitiv)+'<br>添加：'+new Date(v.createdAt).toLocaleDateString()+' · 到期：'+new Date(v.due).toLocaleString()+' · 间隔：'+v.interval+'天 · 熟练度：'+v.ease.toFixed(1)+'</p></div><div class="card"><h3>详细解释</h3><p>'+dash(v.explain)+'</p><p class="mu">搭配：'+dash((v.collocations||[]).join('、'))+'<br>易错点：'+dash(v.pitfalls)+'<br>同义：'+dash((v.synonyms||[]).join('、'))+' 反义：'+dash((v.antonyms||[]).join('、'))+'</p></div><div class="card"><h3>变形表</h3>'+(tables(d)||'—')+'</div><div class="card"><h3>例句</h3>'+exHtml(v.examples)+'</div><div class="row"><button class="p" data-a="more3" '+(S.busy?'disabled':'')+'>'+(S.busy?'AI 生成中…':'AI 解释 / 再来 3 条例句')+'</button><button data-a="vedit">编辑</button><button class="d" data-a="vdel" data-id="'+esc(v.id)+'">删除</button></div>'};
V.rev=()=>{const q=D.vocab.filter(v=>v.due<=Date.now());const v=q[0];if(!v)return'<h1><button data-a="back">‹ 返回</button></h1><p class="mu">复习完成 🎉</p>';
return '<h1><button data-a="back">‹ 返回</button><span class="mu">到期 '+q.length+'</span></h1><div class="card" data-a="flip" style="text-align:center;min-height:160px"><h2>'+esc(v.word)+'</h2>'+(S.flip?'<p>'+esc(v.zh)+'</p><p class="mu">'+esc((v.examples[0]||{}).de||'')+'</p>':'<p class="mu">点击翻面</p>')+'</div><div class="row"><button class="d g" data-a="rate" data-r="0">忘了</button><button class="p g" data-a="rate" data-r="1">记得</button></div>'};
V.t2=()=>{if(S.sub==='imp')return V.imp();if(S.sub==='gen')return V.gen();if(S.sub==='tp')return V.tp();
return '<h1>学习主题</h1><div class="row"><button class="p g" data-a="go" data-s="gen">✨ AI 生成</button><button class="p g" data-a="go" data-s="imp">📥 导入文本</button></div><div class="grid" style="margin-top:12px">'+topics().map(t=>{const m=t.lines.filter((_,i)=>D.mastered[t.id+'_'+i]).length;return '<div class="card tp" data-a="tp" data-id="'+esc(t.id)+'"><div style="font-size:28px">'+esc(t.emoji)+'</div><b>'+esc(t.title)+'</b><div class="mu">'+m+' / '+t.lines.length+'</div><div class="bar"><i style="width:'+(t.lines.length?m/t.lines.length*100:0)+'%"></i></div></div>'}).join('')+'</div>'};
const wrap=s=>esc(s).replace(/[A-Za-zÄÖÜäöüß]+/g,w=>'<span class="w'+(known(w)?' k':'')+'" data-a="word" data-w="'+w+'">'+w+'</span>');
const selH=(id,o,v,lab)=>'<label for="'+id+'">'+lab+'</label><select id="'+id+'">'+o.map(x=>'<option'+(String(x)===String(v)?' selected':'')+'>'+x+'</option>').join('')+'</select>';
const chk=(id,v,lab,dis)=>'<label class="c"><input type="checkbox" id="'+id+'"'+(v?' checked':'')+(dis?' disabled':'')+'>'+lab+'</label>';
function visIdx(t){const q=S.tq.toLowerCase(),r=[];t.lines.forEach((l,i)=>{if(q&&!((l.de||'')+' '+(l.zh||'')).toLowerCase().includes(q))return;if(!C.ui.showMastered&&!S.manage&&D.mastered[t.id+'_'+i])return;r.push(i)});return r}
V.tp=()=>{const t=D.importedTopics.find(x=>x.id===S.tid);if(!t)return'';const az=C.tts.engine==='azure',n=t.lines.length,lock=!!S.tq;
let h='<h1><button data-a="back">‹ 返回</button><span class="g" style="flex:1">'+esc(t.emoji+' '+t.title)+'</span></h1><div class="row"><button class="p" data-a="play">'+(S.playing?'■ 停止':'▶ 连续播放')+'</button><button data-a="mng">'+(S.manage?'完成':'管理')+'</button><button data-a="tset" aria-label="设置面板">⚙ 设置</button>'+(S.manage?'<button class="d" data-a="tdel">删除主题</button>':'')+'</div>';
if(S.tset)h+='<div class="card">'+selH('tr',[1,2,3,5],C.ui.repeat,'重复次数')+selH('tsp',[0.6,0.8,1],C.ui.speechRate,'德语速度')+chk('tz',C.ui.showZh,'含中文（显示并朗读）')+chk('tm',C.ui.showMastered,'显示已掌握')+chk('tb',C.ui.bg&&az,'后台播放（仅 Azure 可用）',!az)+(az?'':'<p class="mu">系统语音息屏后会停止，请在设置中启用 Azure。</p>')+'<button data-a="aitr" '+(S.busy?'disabled':'')+'>'+(S.busy?'翻译中…':'AI 翻译缺失')+'</button></div>';
h+='<input id="tq" placeholder="搜索句子" value="'+esc(S.tq)+'">';
return h+(visIdx(t).map(i=>{const l=t.lines[i],m=D.mastered[t.id+'_'+i];return '<div class="li" id="ln'+i+'"><div class="g">'+wrap(l.de)+(C.ui.showZh&&l.zh?'<div class="mu">'+esc(l.zh)+'</div>':'')+'</div>'+spk(l.de)+(S.manage?'<div class="row" style="width:100%"><button data-a="ledit" data-i="'+i+'" aria-label="编辑">✎</button><button data-a="move" data-i="'+i+'" data-d="-1" aria-label="上移" '+(lock||i===0?'disabled':'')+'>↑</button><button data-a="move" data-i="'+i+'" data-d="1" aria-label="下移" '+(lock||i===n-1?'disabled':'')+'>↓</button><button data-a="mast" data-i="'+i+'">'+(m?'✓ 已掌握':'标记掌握')+'</button><button class="d" data-a="ldel" data-i="'+i+'" aria-label="删除">🗑</button></div>':'')+'</div>'}).join('')||'<p class="mu">没有符合的句子</p>')};
V.imp=()=>'<h1><button data-a="back">‹ 返回</button>导入文本</h1><label for="it">标题</label><input id="it"><label for="ix">文本（每行一句，或 德语 | 中文，最多 200 句）</label><textarea id="ix"></textarea><label for="if">上传 .txt/.md</label><input id="if" type="file" accept=".txt,.md"><label class="c"><input type="checkbox" id="itr" checked>自动翻译成中文</label><button class="p" data-a="save-imp" '+(S.busy?'disabled':'')+'>'+(S.busy?'翻译中…':'保存为主题')+'</button>';
V.gen=()=>{let h='<h1><button data-a="back">‹ 返回</button>AI 生成</h1><label for="gs">场景</label><input id="gs" placeholder="在火车站买票"><button class="p" data-a="gen" '+(S.busy?'disabled':'')+'>'+(S.busy?'生成中…':'生成对话 (10句)')+'</button>';
if(S.gen)h+='<div class="card"><h3>'+esc(S.gen.emoji+' '+S.gen.title)+'</h3>'+S.gen.lines.map(l=>'<div class="li"><div class="g">'+esc(l.de)+'<div class="mu">'+esc(l.zh)+'</div></div></div>').join('')+'<button class="p" data-a="gsave">保存为主题</button></div>';return h};
V.t3=()=>{const a=C.ai;return '<h1>设置</h1><div class="card"><h3>AI 服务</h3><label for="cp">提供商</label><select id="cp"><option value="openai">OpenAI 兼容</option><option value="claude">Claude</option></select><label for="cb">Base URL</label><input id="cb" value="'+esc(a.baseUrl)+'"><label for="cm">模型</label><input id="cm" value="'+esc(a.model)+'"><label for="ck">API Key</label><input id="ck" type="password" value="'+esc(a.apiKey)+'"><div class="row"><button data-a="preset" data-p="ds">DeepSeek</button><button data-a="preset" data-p="oa">OpenAI</button><button data-a="preset" data-p="qw">通义千问</button><button data-a="preset" data-p="gm">Gemini</button></div><div class="row" style="margin-top:8px"><button class="p" data-a="savecfg">保存设置</button><button data-a="testai">测试 AI</button></div></div><div class="card"><h3>语音与词典</h3><label for="cr">德语语速</label><select id="cr"><option>0.6</option><option>0.8</option><option>1</option></select><label for="cd">自定义词典网址（{w} 代表单词）</label><input id="cd" value="'+esc(C.dict.customUrl)+'"><button data-a="savecfg">保存</button></div>'+syncCard()+voiceCard()+'<div class="card"><h3>外观</h3><label for="ct">主题</label><select id="ct"><option value="auto">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></div><div class="card"><h3>应用</h3><p class="mu">网络：'+(navigator.onLine?'在线':'离线')+'</p>'+(S.inst?'<button class="p" data-a="inst">添加到主屏幕</button>':'')+'</div><div class="card"><h3>数据管理</h3><div class="row"><button data-a="seed">恢复内置主题</button><button data-a="exp">导出备份</button><button data-a="imp-b">导入备份</button><button class="d" data-a="wipe">清除本机数据</button></div><input id="bf" type="file" accept=".json" hidden></div>'};
/* ===== render ===== */
function vf(id,list,val,lab){const c=val&&!list.includes(val);return '<label for="'+id+'">'+lab+'</label><select id="'+id+'">'+list.map(v=>'<option'+(v===val?' selected':'')+'>'+v+'</option>').join('')+'<option value="__c"'+(c?' selected':'')+'>自定义…</option></select><input id="'+id+'c" placeholder="voice 名称" value="'+esc(c?val:'')+'"'+(c?'':' hidden')+'>'}
const voiceCard=()=>{const T=C.tts,az=T.engine==='azure';return '<div class="card"><h3>语音（TTS）</h3><label for="te">引擎</label><select id="te"><option value="system">系统语音</option><option value="azure">Azure</option></select>'+(az?vf('azd',AZDE,T.deVoice,'德语声音')+vf('azz',AZZH,T.zhVoice,'中文声音')+'<label for="azk">Azure Key</label><input id="azk" type="password" value="'+esc(T.azureKey||'')+'"><label for="azr">区域（如 westeurope）</label><input id="azr" value="'+esc(T.azureRegion||'')+'">':'<p class="mu">系统语音：德语 de-DE、中文 zh-CN；息屏后会停止。</p>')+'<div class="row"><button class="p" data-a="azsave">保存并试听</button>'+(az?'<button data-a="azclr">清除缓存</button>':'')+'</div>'+(az?'<p class="mu" id="cs">缓存：…</p>':'')+'</div>'};
function render(){const root=document.documentElement;root.dataset.t=C.theme;$('#nv').innerHTML=TABS.map((t,i)=>'<button class="'+(S.tab===i?'on':'')+'" data-a="tab" data-i="'+i+'">'+t+'</button>').join('');$('#app').innerHTML=V['t'+S.tab]();
if(S.tab===3){$('#cp').value=C.ai.provider;$('#cr').value=String(C.ui.speechRate);$('#ct').value=C.theme;$('#te').value=C.tts.engine;$('#sy').value=String(C.sync.interval);if($('#cs'))cacheInfo().then(n=>{if($('#cs'))$('#cs').textContent='已缓存语音 '+n+' 条'})}}
function sheet(h){$('#sh').innerHTML=h;$('#sh').style.display=$('#ov').style.display='block'}
function closeSheet(){$('#sh').style.display=$('#ov').style.display='none'}
function wordSheet(w,ctx){S.cur={w,ctx,d:null};const v=D.vocab.find(x=>x.lemma.toLowerCase()===w.toLowerCase());
sheet('<h2 class="row"><span class="g">'+esc(w)+'</span>'+spk(w)+'</h2><p><a href="https://de.wiktionary.org/wiki/'+encodeURIComponent(w)+'" target="_blank" rel="noopener">词典 ↗</a>'+(C.dict.customUrl?' · <a href="'+esc(C.dict.customUrl.replace('{w}',encodeURIComponent(w)))+'" target="_blank" rel="noopener">自定义 ↗</a>':'')+'</p><button class="p" id="sl" data-a="slook">AI 结合上下文查义</button><label for="sz">中文释义</label><input id="sz" value="'+esc(v?v.zh:'')+'"><button class="p" data-a="sadd">加入 / 更新生词本</button>')}
/* ===== events ===== */
const A={
tab(e){S.tab=+e.dataset.i;S.sub='';S.manage=false;render()},
query(){doQuery()},lookup(e){S.q=e.dataset.w;doQuery(true)},hist(e){openHist(e.dataset.id)},
clrhist(){if(confirm('清空历史？')){D.history=[];saveD();render()}},
addres(){if(S.res&&S.res.type==='word')addVocab(S.res.data,'');render()},
more(){S.vlim+=100;render()},mng(){S.manage=!S.manage;render()},
vd(e){S.sel=e.dataset.id;S.sub='vd';render()},back(){S.sub=S.sub==='vd'&&S.tab===1?'':'';S.rev=null;S.flip=0;render()},
vdel(e){if(!confirm('确认删除？'))return;const dv=D.vocab.find(v=>v.id===e.dataset.id);if(dv)D.deleted['w_'+dv.word.toLowerCase()]=1;D.vocab=D.vocab.filter(v=>v.id!==e.dataset.id);saveD();S.sub='';render()},
rev(){S.sub='rev';S.flip=0;render()},flip(){S.flip=1;render()},
rate(e){const v=D.vocab.find(x=>x.due<=Date.now());if(!v)return;const n=Date.now();if(e.dataset.r==='1'){v.ease=Math.max(1.3,v.ease+.1);v.interval=v.reps===0?1:v.reps===1?6:Math.round(v.interval*v.ease);v.reps++;v.due=n+v.interval*864e5}else{v.ease=Math.max(1.3,v.ease-.2);v.interval=0;v.reps=0;v.due=n+6e5}saveD();S.flip=0;render()},
async more3(){const v=D.vocab.find(x=>x.id===S.sel);if(!v||S.busy)return;S.busy=true;render();try{const r=await ai('为德语单词 '+v.word+' 再写3条B1例句，输出JSON数组[{"de":"","zh":""}]');v.examples.push(...r.filter(x=>x&&x.de).map(x=>({de:str(x.de),zh:str(x.zh)})));saveD()}catch(e){toast(e.message==='noai'?'请先在设置中配置 AI':e.message)}S.busy=false;render()},
vedit(){const v=D.vocab.find(x=>x.id===S.sel);sheet('<h2>编辑</h2><label for="ez">中文释义</label><input id="ez" value="'+esc(v.zh)+'"><label for="ee">详细解释</label><textarea id="ee">'+esc(v.explain||'')+'</textarea><button class="p" data-a="esave">保存</button>')},
esave(){const v=D.vocab.find(x=>x.id===S.sel);v.zh=$('#ez').value;v.explain=$('#ee').value;saveD();closeSheet();render()},
go(e){S.sub=e.dataset.s;render()},tp(e){S.tq='';S.tset=0;S.tid=e.dataset.id;S.sub='tp';S.manage=false;render()},
mast(e){const k=S.tid+'_'+e.dataset.i;D.mastered[k]?delete D.mastered[k]:D.mastered[k]=1;saveD();render()},
ldel(e){if(!confirm('确认删除？'))return;const t=D.importedTopics.find(x=>x.id===S.tid),i=+e.dataset.i,n=t.lines.length;for(let k=i;k<n;k++){const v=D.mastered[t.id+'_'+(k+1)];if(v)D.mastered[t.id+'_'+k]=1;else delete D.mastered[t.id+'_'+k]}t.lines.splice(i,1);saveD();render()},
tdel(){if(!confirm('确认删除主题？'))return;D.deleted[S.tid]=1;saveD();S.sub='';render()},
say(e){say(e.dataset.t,e.dataset.l)},
tset(){S.tset=!S.tset;render()},
move(e){const t=D.importedTopics.find(x=>x.id===S.tid),i=+e.dataset.i,j=i+ +e.dataset.d;if(j<0||j>=t.lines.length)return;[t.lines[i],t.lines[j]]=[t.lines[j],t.lines[i]];const a=t.id+'_'+i,b=t.id+'_'+j,x=D.mastered[a],y=D.mastered[b];x?D.mastered[b]=1:delete D.mastered[b];y?D.mastered[a]=1:delete D.mastered[a];saveD();render()},
ledit(e){const t=D.importedTopics.find(x=>x.id===S.tid),l=t.lines[+e.dataset.i];S.eli=+e.dataset.i;sheet('<h2>编辑句子</h2><label for="ed">德语</label><textarea id="ed">'+esc(l.de)+'</textarea><label for="ez2">中文</label><textarea id="ez2">'+esc(l.zh||'')+'</textarea><button class="p" data-a="lsave">保存</button>')},
lsave(){const t=D.importedTopics.find(x=>x.id===S.tid),l=t.lines[S.eli],de=$('#ed').value.trim();if(!de)return toast('德语不能为空');l.de=de;l.zh=$('#ez2').value.trim();saveD();closeSheet();render()},
async aitr(){const t=D.importedTopics.find(x=>x.id===S.tid),need=t.lines.filter(l=>!l.zh);if(!need.length)return toast('没有缺失的翻译');if(S.busy)return;S.busy=true;render();try{const z=await translateLines(need.map(l=>l.de));need.forEach((l,i)=>l.zh=z[i]);saveD();toast('已补全 '+need.length+' 句')}catch(x){toast(x.message==='noai'?'请先在设置中配置 AI':x.message)}S.busy=false;render()},
async play(){if(S.playing){cancelPlay=true;stopAudio();S.playing=false;render();return}const t=D.importedTopics.find(x=>x.id===S.tid),idx=visIdx(t),az=C.tts.engine==='azure';if(!idx.length)return toast('没有可播放的句子');S.playing=true;cancelPlay=false;
if(!az)toast('系统语音息屏后会停止；Azure 可后台播放');if(az&&C.ui.bg&&'mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:'德语助手'});navigator.mediaSession.setActionHandler('pause',()=>{cancelPlay=true;stopAudio()})}catch(x){}}render();
for(const i of idx){if(cancelPlay)break;const l=t.lines[i],el=$('#ln'+i);if(el){el.classList.add('hl');el.scrollIntoView({block:'center',behavior:'smooth'})}for(let r=0;r<C.ui.repeat&&!cancelPlay;r++)await speak(l.de,'de');if(C.ui.showZh&&l.zh&&!cancelPlay)await speak(l.zh,'zh');if(el)el.classList.remove('hl')}S.playing=false;if(S.sub==='tp')render()},
word(e){const g=e.closest('.g').cloneNode(true);g.querySelectorAll('.mu').forEach(x=>x.remove());wordSheet(e.dataset.w,g.textContent.trim())},
async slook(e){const b=$('#sl');b.disabled=true;b.textContent='查询中…';try{const d=await lookupWord(S.cur.w,S.cur.ctx);S.cur.d=d;$('#sz').value=d.zh}catch(x){toast(x.message==='noai'?'请先在设置中配置 AI':x.message)}b.disabled=false;b.textContent='AI 结合上下文查义'},
sadd(){const w=S.cur.w;const d=S.cur.d||norm({lemma:w},w);d.zh=$('#sz').value.trim()||d.zh;addVocab(d,S.cur.ctx,w);closeSheet();render()},
async 'save-imp'(){const txt=$('#ix').value;let L=parseImport(txt);if(!L.length)return toast('请输入内容');const title=$('#it').value.trim()||'导入文本';const tr=$('#itr').checked;
if(tr){const need=L.filter(l=>!l.zh);if(need.length){S.busy=true;const keep=[$('#it').value,txt];render();$('#it').value=keep[0];$('#ix').value=keep[1];const z=await translateLines(need.map(l=>l.de));need.forEach((l,i)=>l.zh=z[i]);S.busy=false}}
mergeTopic({id:uid('imp_'),title,emoji:'📄',source:'import',lines:L});S.sub='';render()},
async gen(){const sc=$('#gs').value.trim();if(!sc)return toast('请输入场景');S.busy=true;render();try{const r=await ai('场景：'+sc+'。生成B1水平自然常用的德语对话10句，不标说话人，输出JSON：{"title":"简短中文标题","emoji":"一个emoji","lines":[["德语","中文"]]}');if(!Array.isArray(r.lines))throw new Error('AI 返回格式异常，请重试');S.gen={title:str(r.title)||sc,emoji:str(r.emoji)||'💬',lines:r.lines.slice(0,10).map(l=>({de:str(l[0]),zh:str(l[1]),hidden:false}))}}catch(e){toast(e.message==='noai'?'请先在设置中配置 AI':e.message)}S.busy=false;render();if($('#gs'))$('#gs').value=sc},
gsave(){mergeTopic({id:uid('imp_'),title:S.gen.title,emoji:S.gen.emoji,source:'ai',lines:S.gen.lines});S.gen=null;S.sub='';render()},
preset(e){const p={ds:['https://api.deepseek.com/v1','deepseek-chat'],oa:['https://api.openai.com/v1','gpt-4o-mini'],qw:['https://dashscope.aliyuncs.com/compatible-mode/v1','qwen-plus'],gm:['https://generativelanguage.googleapis.com/v1beta/openai','gemini-2.0-flash']}[e.dataset.p];$('#cp').value='openai';$('#cb').value=p[0];$('#cm').value=p[1]},
savecfg(){C.ai={provider:$('#cp').value,baseUrl:$('#cb').value.trim(),model:$('#cm').value.trim(),apiKey:$('#ck').value.trim()};C.ui.speechRate=+$('#cr').value;C.dict.customUrl=$('#cd').value.trim();C.theme=$('#ct').value;saveC();render();toast('已保存')},
async testai(){A.savecfg();try{await ai('输出JSON {"ok":true}');toast('AI 连接正常')}catch(e){toast(e.message==='noai'?'请先填写 API Key':e.message)}},
azsave(){const T=C.tts,g=(s,c)=>{const v=$('#'+s).value;return v==='__c'?$('#'+c).value.trim():v};if(T.engine==='azure'){T.deVoice=g('azd','azdc');T.zhVoice=g('azz','azzc');T.azureKey=$('#azk').value.trim();T.azureRegion=$('#azr').value.trim().toLowerCase();if(!T.azureKey||!T.azureRegion)return toast('请填写 Azure Key 和区域')}saveC();azWarned=false;toast('已保存');stopAudio();speak('Guten Tag! Schön, dich zu sehen.','de')},
async azclr(){try{await caches.delete('dl-tts')}catch(e){}toast('语音缓存已清除');render()},
savesync(){C.sync={appsScriptUrl:$('#su').value.trim(),token:$('#st').value.trim(),interval:+$('#sy').value};if(C.sync.appsScriptUrl&&!/^https:\/\/script\.google\.com\//.test(C.sync.appsScriptUrl))return toast('网址应以 https://script.google.com/ 开头');saveC();syncNow(true)},
syncnow(){syncNow(true)},
inst(){S.inst.prompt();S.inst=null;render()},
seed(){delete D.deleted[BUILTIN.id];if(!D.importedTopics.find(t=>t.id===BUILTIN.id))D.importedTopics.unshift(BUILTIN);saveD();toast('已恢复')},
exp(){const b=new Blob([JSON.stringify(Object.assign({},D))],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='deutsch-backup.json';a.click()},
'imp-b'(){$('#bf').click()},
wipe(){if(confirm('清除本机所有数据？')&&confirm('再次确认')){localStorage.removeItem('dl');localStorage.removeItem('dl_cache');location.reload()}}};
document.addEventListener('click',e=>{if(e.target.id==='ov')return closeSheet();const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('input',e=>{if(e.target.id==='tq'){S.tq=e.target.value;const p=e.target.selectionStart;render();const i=$('#tq');i.focus();i.setSelectionRange(p,p);return}if(e.target.id==='q')S.q=e.target.value;if(e.target.id==='vq'){S.vq=e.target.value;S.vlim=100;const p=e.target.selectionStart;render();const i=$('#vq');i.focus();i.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{const id=e.target.id,u=C.ui;if(['tr','tsp','tz','tm','tb'].includes(id)){if(id==='tr')u.repeat=+e.target.value;if(id==='tsp')u.speechRate=+e.target.value;if(id==='tz')u.showZh=e.target.checked;if(id==='tm')u.showMastered=e.target.checked;if(id==='tb')u.bg=e.target.checked;saveC();render();return}if(e.target.id==='te'){C.tts.engine=e.target.value;saveC();render();return}if(e.target.id==='azd'||e.target.id==='azz')$('#'+e.target.id+'c').hidden=e.target.value!=='__c';if(e.target.id==='vs'){S.vsort=e.target.value;render()}
if(e.target.id==='if'){const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>{$('#ix').value=String(r.result);if(!$('#it').value)$('#it').value=f.name.replace(/\.\w+$/,'')};r.readAsText(f)}}
if(e.target.id==='bf'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.vocab||[]))throw 0;mergeData(o);saveD();toast('已合并导入');render()}catch(x){toast('备份文件无效')}};r.readAsText(f)}});
addEventListener('online',render);addEventListener('offline',()=>{toast('已离线');render()});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.inst=e;if(S.tab===3)render()});
/* ===== sync (Google Apps Script) ===== */
let syncing=false,syncT=null,sst='';
const payload=()=>({mastered:D.mastered,vocab:D.vocab,importedTopics:D.importedTopics,history:D.history,deleted:D.deleted,order:D.order,sort:D.sort,updatedAt:D.updatedAt});
function mergeData(o){if(!o||typeof o!=='object')return;Object.assign(D.deleted,o.deleted||{});
for(const v of o.vocab||[]){if(!v||!v.word)continue;const k=v.word.toLowerCase();if(D.deleted['w_'+k])continue;const x=D.vocab.find(y=>y.word.toLowerCase()===k);if(!x)D.vocab.push(v);else if((v.due||0)>x.due)Object.assign(x,v)}
D.vocab=D.vocab.filter(v=>!D.deleted['w_'+v.word.toLowerCase()]);
for(const t of o.importedTopics||[]){if(!t||!t.id)continue;const x=D.importedTopics.find(y=>y.id===t.id);if(!x)D.importedTopics.push(t);else if((t.lines||[]).length>x.lines.length)x.lines=t.lines}
for(const h of o.history||[])if(h&&h.id&&!D.history.find(y=>y.id===h.id))D.history.push(h);D.history.sort((a,b)=>b.createdAt-a.createdAt);D.history=D.history.slice(0,100);
Object.assign(D.mastered,o.mastered||{});D.order=[...new Set([...(D.order||[]),...(o.order||[])])]}
async function post(action,data){let r,j;try{r=await fetch(C.sync.appsScriptUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:C.sync.token,action,data})})}catch(e){throw new Error('无法连接同步服务')}
if(!r.ok)throw new Error('同步服务错误 '+r.status);try{j=await r.json()}catch(e){throw new Error('返回格式异常，请确认网址以 /exec 结尾且访问权限为“任何人”')}
if(!j.ok)throw new Error(j.error==='口令错误'||j.error==='token'?'同步口令不正确':'同步失败：'+(j.error||'未知错误'));return j.data}
function setSt(t){sst=t;if($('#sst'))$('#sst').textContent=t}
async function syncNow(manual){if(!C.sync.appsScriptUrl){if(manual)toast('请先填写 Apps Script 网址');return}if(syncing)return;if(!navigator.onLine){setSt('离线，联网后自动同步');if(manual)toast('离线，无法同步');return}
syncing=true;setSt('同步中…');try{const rem=await post('get');if(rem)mergeData(rem);D.updatedAt=Date.now();await post('set',payload());D.dirty=0;wr('dl',D);setSt('已同步 '+new Date().toLocaleTimeString());if(manual)toast('同步完成');
if(!$('#sh').style.display.includes('block')&&S.tab<3&&!['imp','gen'].includes(S.sub)&&!S.busy)render()}catch(e){setSt('同步失败：'+e.message+'（本地数据不受影响）');if(manual)toast(e.message)}syncing=false}
function schedSync(){if(!C.sync.appsScriptUrl||!C.sync.interval)return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(),Math.max(3,C.sync.interval)*1000)}
const syncCard=()=>'<div class="card"><h3>同步（Google Apps Script）</h3><label for="su">Apps Script 网址</label><input id="su" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(C.sync.appsScriptUrl)+'"><label for="st">同步口令</label><input id="st" type="password" value="'+esc(C.sync.token)+'"><label for="sy">自动同步间隔（修改后延迟多久上传）</label><select id="sy"><option value="3">几秒</option><option value="30">30 秒</option><option value="60">1 分钟</option><option value="300">5 分钟</option><option value="0">仅手动</option></select><div class="row"><button class="p" data-a="savesync">保存并同步</button><button data-a="syncnow">立即同步</button></div><p class="mu" id="sst">'+esc(sst||(C.sync.appsScriptUrl?'尚未同步':'未配置'))+'</p></div>';
/* ===== PWA ===== */
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').then(reg=>{const ask=w=>toast('有新版本可用，点击刷新',()=>{w.postMessage('skip')});if(reg.waiting&&navigator.serviceWorker.controller)ask(reg.waiting);reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)ask(w)})})}).catch(()=>toast('离线功能注册失败，需通过 https 打开'));let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!rl&&localStorage.getItem('dl_upd')!=='x'){rl=true;location.reload()}})}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.playing&&!(C.ui.bg&&C.tts.engine==='azure')){cancelPlay=true;stopAudio()}});addEventListener('online',()=>syncNow());document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
render();syncNow();
</script></body></html>
