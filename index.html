function parseWords(txt){const m=new Map();for(const raw of txt.replace(/\r/g,'').split('\n')){const l=raw.trim();if(!l)continue;const p=l.split(/\s*[|｜│¦∣\t]\s*/).map(s=>s.trim());let a=p[0]||'',z=p[1]||'';if(hasCJK(a)&&!hasCJK(z)){const t=a;a=z;z=t}if(!a||hasCJK(a)||a.length>60)continue;a=normW(a);if(!m.has(bare(a)))m.set(bare(a),{w:a,zh:z})}return [...m.values()].slice(0,300)}
async function enrich(list){for(let i=0;i<list.length;i+=20){const b=list.slice(i,i+20);let r=null;

b.forEach((x,j)=>{const o=r&&r[j];if(o&&typeof o==='object'){const w=normW(str(o.w));if(w&&bare(w)===bare(x.w))x.w=w;if(!x.zh)x.zh=str(o.zh)}});
if(!r)for(const x of b){if(!x.zh)try{x.zh=await quickGloss(x.w)}catch(e){}}
S.prog='补全中 '+Math.min(i+20,list.length)+'/'+list.length;const bt=$('[data-a="wsave"]');if(bt)bt.textContent=S.prog}}

function revState(v){if(S.rv&&S.rv.id===v.id)return S.rv;const modes=(C.ui.rmodes&&C.ui.rmodes.length?C.ui.rmodes:['flip']).slice();let mode=shuf(modes)[0],opts=[],ans='';

document.addEventListener('change',e=>{const id=e.target.id,u=C.ui;if(id==='cp'||id==='cb'){aiStash();aiLoad(id==='cp');return}if(id==='bd'){const b=D.books.find(x=>x.id===S.bid);b.daily=+e.target.value;saveD();render();return}
if(id==='tbk'){const t=D.importedTopics.find(x=>x.id===S.tid);t.book=e.target.value;t.ut=Date.now();saveD();return}
if(id==='wf'){const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>{$('#wt').value=String(r.result)};r.readAsText(f)}return}if(id.indexOf('rm_')===0){const k=id.slice(3),s=new Set(u.rmodes||['flip']);if(e.target.checked)s.add(k);else s.delete(k);if(!s.size){s.add('flip');toast('至少保留一种方式')}u.rmodes=[...s];S.rv=null;saveC();render();return}if(['tr','tsp','tz','tm','tb','vr','vz','vrv','ra','rx','vbg'].includes(id)){if(id==='ra'){u.autoDe=e.target.checked;saveC();return}if(id==='rx'){u.showEx=e.target.checked;S.rv=null;saveC();render();return}if(id==='tr'||id==='vr')u.repeat=+e.target.value;if(id==='vz')u.vzh=e.target.checked;if(id==='vrv'){S.vrev=e.target.checked;u.vrev=S.vrev}if(id==='tsp')u.speechRate=+e.target.value;if(id==='tz')u.showZh=e.target.checked;if(id==='tm')u.showMastered=e.target.checked;if(id==='tb'||id==='vbg')u.bg=e.target.checked;saveC();render();return}if(e.target.id==='te'){C.tts.engine=e.target.value;saveC();render();return}if(e.target.id==='azd'||e.target.id==='azz')$('#'+e.target.id+'c').hidden=e.target.value!=='__c';if(e.target.id==='vs'){S.vsort=e.target.value;C.ui.vsort=S.vsort;saveC();render()}
if(e.target.id==='if'){const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>{$('#ix').value=String(r.result);if(!$('#it').value)$('#it').value=f.name.replace(/\.\w+$/,'')};r.readAsText(f)}}
if(e.target.id==='bf'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.vocab||[]))throw 0;mergeData(o);saveD();toast('已合并导入');render()}catch(x){toast('备份文件无效')}};r.readAsText(f)}});

/* ===== sync (Google Apps Script) ===== */
let syncing=false,syncT=null,sst='';
const payload=()=>({books:D.books,mastered:D.mastered,vocab:D.vocab,importedTopics:D.importedTopics,history:D.history,deleted:D.deleted,order:D.order,sort:D.sort,updatedAt:D.updatedAt});
function mergeData(o){if(!o||typeof o!=='object')return;Object.assign(D.deleted,o.deleted||{});for(const b of o.books||[])if(b&&b.id&&!D.deleted[b.id]&&!D.books.find(x=>x.id===b.id))D.books.push(b);
for(const v of o.vocab||[]){if(!v||!v.word)continue;const k=v.word.toLowerCase();if(D.deleted['w_'+k])continue;const x=D.vocab.find(y=>y.word.toLowerCase()===k);if(!x)D.vocab.push(v);else if((v.due||0)>x.due)Object.assign(x,v)}
D.vocab=D.vocab.filter(v=>!D.deleted['w_'+v.word.toLowerCase()]);
const st={};for(const t of o.importedTopics||[]){if(!t||!t.id||!Array.isArray(t.lines))continue;const x=D.importedTopics.find(y=>y.id===t.id);
if(!x){D.importedTopics.push(t);st[t.id]='remote'}else if((t.ut||0)>(x.ut||0)){x.lines=t.lines;x.ut=t.ut;x.title=t.title||x.title;st[t.id]='remote'}else st[t.id]=(t.ut||0)<(x.ut||0)?'local':'same'}
for(const id in st)if(st[id]==='remote')for(const k of Object.keys(D.mastered))if(k.slice(0,k.lastIndexOf('_'))===id)delete D.mastered[k];
for(const k in o.mastered||{}){const id=k.slice(0,k.lastIndexOf('_'));if(st[id]!=='local')D.mastered[k]=1}
for(const h of o.history||[])if(h&&h.id&&!D.history.find(y=>y.id===h.id))D.history.push(h);D.history.sort((a,b)=>b.createdAt-a.createdAt);D.history=D.history.slice(0,100);
D.order=[...new Set([...(D.order||[]),...(o.order||[])])];migrate()}
async function post(action,data){let r,j;try{r=await fetch(C.sync.appsScriptUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:C.sync.token,action,data})})}catch(e){throw new Error('无法连接同步服务')}
if(!r.ok)throw new Error('同步服务错误 '+r.status);try{j=await r.json()}catch(e){throw new Error('返回格式异常，请确认网址以 /exec 结尾且访问权限为“任何人”')}
if(!j.ok)throw new Error(j.error==='口令错误'||j.error==='token'?'同步口令不正确':'同步失败：'+(j.error||'未知错误'));return j.data}
function setSt(t){sst=t;if($('#sst'))$('#sst').textContent=t}
async function syncNow(manual){if(!C.sync.appsScriptUrl){if(manual)toast('请先填写 Apps Script 网址');return}if(syncing)return;if(!navigator.onLine){setSt('离线，联网后自动同步');if(manual)toast('离线，无法同步');return}
syncing=true;setSt('同步中…');try{const rem=await post('get');if(rem)mergeData(rem);D.updatedAt=Date.now();await post('set',payload());D.dirty=0;wr('dl',D);setSt('已同步 '+new Date().toLocaleTimeString());if(manual)toast('同步完成');
if(!$('#sh').style.display.includes('block')&&S.tab<3&&!['imp','gen'].includes(S.sub)&&!S.busy)render()}catch(e){setSt('同步失败：'+e.message+'（本地数据不受影响）');if(manual)toast(e.message)}syncing=false}
function schedSync(){if(!C.sync.appsScriptUrl||!C.sync.interval)return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(),Math.max(3,C.sync.interval)*1000)}
const syncCard=()=>'<div class="card"><h3>同步（Google Apps Script）</h3><label for="su">Apps Script 网址</label><input id="su" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(C.sync.appsScriptUrl)+'"><label for="st">同步口令</label><input id="st" type="password" value="'+esc(C.sync.token)+'"><label for="sy">自动同步间隔（修改后延迟多久上传）</label><select id="sy"><option value="3">几秒</option><option value="30">30 秒</option><option value="60">1 分钟</option><option value="300">5 分钟</option><option value="0">仅手动</option></select><div class="row"><button class="p" data-a="savesync">保存并同步</button><button data-a="syncnow">立即同步</button></div><p class="mu" id="sst">'+esc(sst||(C.sync.appsScriptUrl?'尚未同步':'未配置'))+'</p></div>';

document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.playing&&!(C.ui.bg&&C.tts.engine==='azure')){cancelPlay=true;stopAudio()}});addEventListener('online',()=>syncNow());document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
