<style>
:root{color-scheme:light;--bg:#f6f4ee;--paper:#fffefa;--ink:#202a30;--muted:#66747b;--line:#deded5;--primary:#1f5f8b;--primary-soft:#e7f0f5;--success:#2e7d4f;--highlight:#fff3c4;--danger:#a23a35;--shadow:0 8px 24px #26323a0b;--nav:rgba(255,254,250,.94)}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Noto Serif SC",serif;font-size:16px;line-height:1.55;padding-top:env(safe-area-inset-top);padding-bottom:calc(70px + env(safe-area-inset-bottom))}button,input,textarea,select{font:inherit}button{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:8px 12px;cursor:pointer;font-family:"Avenir Next","PingFang SC",sans-serif}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}button.quiet{background:transparent}button.danger{color:var(--danger)}input,textarea,select{width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:42px}textarea{min-height:112px;resize:vertical}label{display:block;font-family:"Avenir Next","PingFang SC",sans-serif;font-size:13px;color:var(--muted);margin:12px 0 5px}.wrap{max-width:640px;margin:auto;padding:16px 16px 24px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}.top h1{font:700 25px/1.2 "Avenir Next","PingFang SC",sans-serif;margin:0;letter-spacing:-.4px}.sub{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;gap:8px}.row.wraprow{flex-wrap:wrap}.row>*{min-width:0}.spread{justify-content:space-between}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 8px;font-family:"Avenir Next","PingFang SC",sans-serif}.card h2{font-size:19px}.card h3{font-size:15px}.stack{display:grid;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pill{display:inline-flex;background:var(--primary-soft);color:var(--primary);border-radius:99px;padding:2px 9px;font:12px "Avenir Next","PingFang SC",sans-serif}.muted{color:var(--muted)}.bigword{font-size:25px;font-weight:bold}.speak{border:0;background:transparent;padding:4px;min-width:38px;font-size:20px}.lineitem{padding:12px 0;border-bottom:1px solid var(--line)}.lineitem:last-child{border-bottom:0}.de{font-size:18px}.zh{color:var(--muted);margin-top:4px}.wordmark{text-decoration:underline;text-decoration-color:var(--primary);text-decoration-thickness:2px;text-underline-offset:3px;cursor:pointer}.progress{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;background:var(--success)}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.toolbar button{font-size:13px}.hidden{display:none!important}.bottomnav{position:fixed;z-index:20;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);height:calc(60px + env(safe-area-inset-bottom));padding:4px 4px calc(4px + env(safe-area-inset-bottom));background:var(--nav);backdrop-filter:blur(16px);border-top:1px solid var(--line)}.tab{border:0;border-radius:9px;background:transparent;min-height:50px;padding:3px 1px;color:var(--muted);font-size:12px}.tab span{display:block;font-size:19px;line-height:1.3}.tab.active{background:var(--primary-soft);color:var(--primary);font-weight:bold}.overlay{position:fixed;inset:0;z-index:40;background:#0007;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:640px;max-height:88dvh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #0002}.sheethead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.sheethead h2{margin:0;font:700 20px "Avenir Next","PingFang SC",sans-serif}.toast{position:fixed;z-index:80;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 15px;border-radius:12px;max-width:calc(100% - 32px);box-shadow:var(--shadow);font-size:14px}.empty{text-align:center;padding:28px 12px;color:var(--muted)}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--muted)}.tablewrap{overflow-x:auto}.sectiontitle{font:700 13px "Avenir Next","PingFang SC",sans-serif;color:var(--muted);margin:18px 0 6px}.topic{cursor:pointer;min-height:118px}.topic .emoji{font-size:24px}.status{font-size:12px;color:var(--muted)}.active-sentence{background:var(--highlight);border-radius:8px;padding:6px}.inline{display:inline}.notice{border-left:3px solid var(--primary);padding:8px 10px;background:var(--primary-soft);font-size:13px;border-radius:0 8px 8px 0}.checkrow{display:flex;align-items:center;gap:8px}.checkrow input{width:auto;min-height:auto}.checkrow label{margin:0}.footnote{font-size:12px;color:var(--muted)}@media(min-width:520px){.wrap{padding:22px 20px 30px}.sheet{border-radius:18px;margin-bottom:10px}.overlay{align-items:center;padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main id="app" class="wrap" aria-live="polite"></main>
<nav class="bottomnav" aria-label="主导航">
<button class="tab active" data-tab="translate"><span>文</span>翻译</button>
<button class="tab" data-tab="vocab"><span>▤</span>生词本</button>
<button class="tab" data-tab="learn"><span>✦</span>学习</button>
<button class="tab" data-tab="settings"><span>⚙</span>设置</button>
</nav>
<div id="modalRoot"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
"use strict";
(() => {
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const now=()=>Date.now(), id=p=>p+"_"+Math.random().toString(36).slice(2,10), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeURL=s=>{try{const u=new URL(s);return ["http:","https:"].includes(u.protocol)?u.href:""}catch{return""}};
const defaultsCfg={ai:{provider:"openai",baseUrl:"https://api.deepseek.com/v1",apiKey:"",model:"deepseek-chat"},dict:{customUrl:""},tts:{engine:"system",azureKey:"",azureRegion:"",deVoice:"de-DE-KatjaNeural",zhVoice:"zh-CN-XiaoxiaoNeural",deURI:"",zhURI:""},theme:"auto",sync:{appsScriptUrl:"",token:"",interval:"manual"},ui:{showChineseInTopic:true,showChineseInVocab:true,speechRate:.8,repeat:1,showMastered:true,background:false}};
const builtin=[
{id:"greetings",title:"问候与介绍",emoji:"👋",source:"builtin",lines:[["Guten Morgen! Wie geht es Ihnen?","早上好！您好吗？"],["Mir geht es gut, danke. Und Ihnen?","我很好，谢谢。您呢？"],["Ich heiße Anna und komme aus Berlin.","我叫安娜，来自柏林。"],["Freut mich, Sie kennenzulernen.","很高兴认识您。"],["Könnten Sie das bitte wiederholen?","您能再重复一遍吗？"],["Ich lerne seit einem Jahr Deutsch.","我学德语已经一年了。"],["Haben Sie heute Abend Zeit?","您今晚有时间吗？"],["Wir können uns vor dem Bahnhof treffen.","我们可以在火车站前见面。"],["Vielen Dank für Ihre Hilfe.","非常感谢您的帮助。"],["Bis bald und einen schönen Tag!","回头见，祝您今天愉快！"]]},
{id:"restaurant",title:"在餐厅",emoji:"🍽️",source:"builtin",lines:[["Ich hätte gern einen Tisch für zwei Personen.","我想要一张两人桌。"],["Könnten wir bitte die Speisekarte bekommen?","可以给我们菜单吗？"],["Was können Sie heute empfehlen?","您今天推荐什么？"],["Ich nehme die Suppe als Vorspeise.","我前菜要汤。"],["Ist dieses Gericht vegetarisch?","这道菜是素食的吗？"],["Könnte ich noch ein Glas Wasser haben?","可以再给我一杯水吗？"],["Das Essen schmeckt wirklich ausgezeichnet.","这顿饭确实非常美味。"],["Entschuldigung, wir warten schon ziemlich lange.","不好意思，我们已经等了很久。"],["Könnten Sie die Rechnung bringen?","您可以拿一下账单吗？"],["Wir würden gern getrennt bezahlen.","我们想分开付款。"]]},
{id:"travel",title:"火车站买票",emoji:"🚆",source:"builtin",lines:[["Guten Tag, ich möchte eine Fahrkarte nach München kaufen.","您好，我想买一张去慕尼黑的车票。"],["Wann fährt der nächste Zug ab?","下一班火车什么时候出发？"],["Muss ich unterwegs umsteigen?","我途中需要换乘吗？"],["Wie lange dauert die Fahrt ungefähr?","这趟车大约需要多长时间？"],["Ist der Zug heute pünktlich?","这趟车今天准点吗？"],["Auf welchem Gleis fährt der Zug ab?","火车从几号站台出发？"],["Kann ich die Fahrkarte am Automaten bezahlen?","我可以在自动售票机付款吗？"],["Gibt es eine günstigere Verbindung?","有更便宜的线路吗？"],["Ich habe eine Sitzplatzreservierung.","我有座位预订。"],["Vielen Dank, ich wünsche Ihnen einen schönen Tag.","非常感谢，祝您今天愉快。"]]}
];
let data, cfg, tab="translate", view={page:"main",topicId:"",wordId:"",manage:false,query:"",limit:100,historyResult:null,reviewIndex:0,reviewFlip:false,playing:false,activeLine:-1,aiBusy:false,installPrompt:null,swReg:null,cache:{}};
function normalizeData(d){const x=d&&typeof d==="object"?d:{};return {version:1,updatedAt:x.updatedAt||now(),dirty:x.dirty||0,mastered:x.mastered||{},vocab:Array.isArray(x.vocab)?x.vocab:[],importedTopics:Array.isArray(x.importedTopics)?x.importedTopics:[],history:Array.isArray(x.history)?x.history.slice(0,100):[],deleted:x.deleted||{},order:Array.isArray(x.order)?x.order:[],sort:x.sort||"custom"}}
function load(){try{data=normalizeData(JSON.parse(localStorage.getItem("dl")||"{}"))}catch{data=normalizeData({})}try{cfg={...defaultsCfg,...JSON.parse(localStorage.getItem("dl_cfg")||"{}")};cfg.ai={...defaultsCfg.ai,...cfg.ai};cfg.dict={...defaultsCfg.dict,...cfg.dict};cfg.tts={...defaultsCfg.tts,...cfg.tts};cfg.sync={...defaultsCfg.sync,...cfg.sync};cfg.ui={...defaultsCfg.ui,...cfg.ui}}catch{cfg=structuredClone(defaultsCfg)}}
function save(){data.updatedAt=now();data.dirty=(data.dirty||0)+1;try{localStorage.setItem("dl",JSON.stringify(data));localStorage.setItem("dl_cfg",JSON.stringify(cfg))}catch{toast("本机存储空间不足，请导出备份")}}
function saveCfg(){try{localStorage.setItem("dl_cfg",JSON.stringify(cfg))}catch{} applyTheme();save();toast("设置已保存")}
function applyTheme(){let t=cfg.theme==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):cfg.theme;document.documentElement.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content=t==="dark"?"#14191d":"#f6f4ee"}
function toast(s){const el=$("#toast");el.textContent=s;el.classList.remove("hidden");clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add("hidden"),3000)}
function topicList(){return [...builtin,...data.importedTopics].filter(t=>!data.deleted[t.id])}
function topicById(tid){return topicList().find(t=>t.id===tid)}
function dueWords(){return data.vocab.filter(v=>(v.due||0)<=now())}
function wordById(wid){return data.vocab.find(v=>v.id===wid)}
function normalizeWord(w){const o=w&&typeof w==="object"?w:{};const forms=o.forms||{};const six=src=>Object.fromEntries(["ich","du","er","wir","ihr","sie"].map(k=>[k,String(src?.[k]||"")]));return {id:o.id||id("v"),word:String(o.word||o.lemma||"").trim(),lemma:String(o.lemma||o.word||"").trim(),article:String(o.article||""),plural:String(o.plural||""),genitiv:String(o.genitiv||""),pos:String(o.pos||"—"),zh:String(o.zh||""),explain:String(o.explain||""),forms:{praesens:six(forms.praesens),praeteritum:six(forms.praeteritum),perfekt:String(forms.perfekt||""),imperativ:String(forms.imperativ||""),partizipII:String(forms.partizipII||""),hilfsverb:String(forms.hilfsverb||""),konjunktivII:String(forms.konjunktivII||"")},adjective:o.adjective||{positive:"",komparativ:"",superlativ:""},noun:o.noun||null,examples:Array.isArray(o.examples)?o.examples.slice(0,10).map(e=>({de:String(e.de||""),zh:String(e.zh||"")})):[],collocations:Array.isArray(o.collocations)?o.collocations:[],pitfalls:String(o.pitfalls||""),synonyms:Array.isArray(o.synonyms)?o.synonyms:[],antonyms:Array.isArray(o.antonyms)?o.antonyms:[],context:String(o.context||""),contextForm:String(o.contextForm||""),source:o.source||"手动",createdAt:o.createdAt||now(),due:o.due??now(),interval:o.interval||0,ease:o.ease||2.5,reps:o.reps||0}}
function addWord(raw,context=""){let w=normalizeWord(raw);if(!w.word)return null;w.context=context||w.context;w.contextForm=context?context:w.context;const old=data.vocab.find(v=>v.word.toLocaleLowerCase()===w.word.toLocaleLowerCase()||v.lemma.toLocaleLowerCase()===w.lemma.toLocaleLowerCase());if(old){const due=old.due,createdAt=old.createdAt;Object.assign(old,w,{id:old.id,due,createdAt,interval:old.interval||0,ease:old.ease||2.5,reps:old.reps||0});save();toast("已更新");return old}w.id=id("v");w.createdAt=now();w.due=now();w.interval=0;w.ease=2.5;w.reps=0;data.vocab.unshift(w);save();toast("已加入生词本");return w}
function escList(a){return Array.isArray(a)&&a.length?a.map(esc).join("、"):"—"}
function speakButton(text,lang="de-DE"){return `<button class="speak" data-action="speak" data-text="${esc(text)}" data-lang="${lang}" aria-label="播放发音">🔊</button>`}
function empty(s){return `<div class="empty">${esc(s)}</div>`}
function showMain(){view.page="main";view.wordId="";view.topicId="";render()}
function setTab(t){tab=t;view.page="main";view.manage=false;view.query="";view.limit=100;$$(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));render()}
function render(){const app=$("#app");if(view.page==="detail"){app.innerHTML=renderDetail(wordById(view.wordId));return}if(view.page==="topic"){app.innerHTML=renderTopic(topicById(view.topicId));return}if(view.page==="review"){app.innerHTML=renderReview();return}if(view.page==="import"){app.innerHTML=renderImport();return}if(view.page==="generate"){app.innerHTML=renderGenerate();return}if(view.page==="topicEdit"){app.innerHTML=renderTopicEdit();return}
app.innerHTML=tab==="translate"?renderTranslate():tab==="vocab"?renderVocab():tab==="learn"?renderLearn():renderSettings()}
function header(title,right=""){return `<header class="top"><h1>${title}</h1>${right}</header>`}
function renderTranslate(){const hist=data.history.slice(0,20);return `${header("翻译 / 查词",`<span class="sub">${navigator.onLine?"在线":"离线"}</span>`)}
<section class="card"><label for="queryText">输入德语或中文</label><textarea id="queryText" maxlength="5000" placeholder="例如：Ich gehe heute zum Bahnhof. 或 早餐"></textarea><div class="row spread" style="margin-top:10px"><span class="sub">自动识别语言 · 支持单词与句子</span><button class="primary" id="translateBtn">查询 / 翻译</button></div></section>
<div id="translateResult">${view.historyResult?renderResult(view.historyResult):""}</div>
<section class="row spread"><h2 style="font:700 17px 'Avenir Next','PingFang SC',sans-serif">历史记录</h2><button class="quiet" data-action="clearHistory">清空</button></section>
${hist.length?hist.map(h=>`<button class="card" style="display:block;width:100%;text-align:left" data-action="history" data-id="${esc(h.id)}"><div class="row spread"><strong>${esc(h.query||"查询")}</strong><span class="sub">${new Date(h.createdAt).toLocaleDateString()}</span></div><div class="zh">${esc(h.answer||"")}</div></button>`).join(""):empty("查询记录会保存在这里")}`}
function renderResult(r){if(!r)return"";if(r.type==="word"){const w=normalizeWord(r.word||r);return `<section class="card"><div class="row spread"><div><div class="bigword">${esc(w.lemma||w.word)}</div><div class="zh">${esc(w.zh||"—")}</div></div>${speakButton(w.word)}</div><div style="margin:8px 0"><span class="pill">${esc(w.pos||"—")}</span></div>${w.pos.includes("名词")?`<div class="sectiontitle">名词信息</div><div>冠词：${esc(w.article||"—")}　单数：${esc(w.lemma||w.word)}　复数：${esc(w.plural||"—")}　第二格：${esc(w.genitiv||"—")}</div>`:""}${w.pos.includes("动词")?`<div class="sectiontitle">现在时变位</div>${renderFormsTable(w.forms.praesens,"现在时")}`:""}<div class="sectiontitle">用法提示</div><p>${esc(w.note||w.pitfalls||w.explain||"—")}</p><div class="sectiontitle">详细解释</div><p>${esc(w.explain||"—")}</p>${examplesHTML(w.examples)}<button class="primary" data-action="addResultWord" data-word="${esc(encodeURIComponent(JSON.stringify(w)))}">加入生词本</button> <button data-action="openDetailFromResult" data-word="${esc(encodeURIComponent(JSON.stringify(w)))}">查看详情</button></section>`}
return `<section class="card"><div class="sectiontitle">原文</div><div class="de">${esc(r.de||"—")}</div><div class="row spread"><div class="sectiontitle">译文</div>${speakButton(r.de||"")}</div><div>${esc(r.zh||"—")}</div></section>`}
function examplesHTML(examples){const ex=Array.isArray(examples)?examples:[];return `<div class="sectiontitle">例句</div>${ex.length?ex.map(e=>`<div class="lineitem"><div class="row spread"><div class="de">${esc(e.de||"—")}</div>${speakButton(e.de||"")}</div><div class="zh">${esc(e.zh||"—")}</div></div>`).join(""):empty("暂无例句")}`}
function renderFormsTable(forms,title){const f=forms||{};return `<div class="tablewrap"><table><thead><tr><th colspan="2">${esc(title)}</th></tr></thead><tbody>${[["ich",f.ich],["du",f.du],["er, sie, es",f.er],["wir",f.wir],["ihr",f.ihr],["sie, Sie",f.sie]].map(([a,b])=>`<tr><td>${a}</td><td>${esc(b||"—")}</td></tr>`).join("")}</tbody></table></div>`}
function renderVocab(){const q=view.query.toLowerCase();let list=data.vocab.filter(w=>!q||[w.word,w.lemma,w.zh,w.explain,w.context,w.contextForm,w.pos,...w.examples.map(e=>e.de+" "+e.zh),...Object.values(w.forms.praesens),...Object.values(w.forms.praeteritum)].join(" ").toLowerCase().includes(q));const sort=$("#sortSelect")?.value||"created";list.sort((a,b)=>sort==="alpha"?a.word.localeCompare(b.word):sort==="pos"?a.pos.localeCompare(b.pos):sort==="gender"?a.article.localeCompare(b.article):(b.createdAt||0)-(a.createdAt||0));list=list.slice(0,view.limit);return `${header("生词本",`<button data-action="review" ${dueWords().length?"":"disabled"}>复习 ${dueWords().length}</button>`)}
<div class="toolbar"><button data-action="playAllVocab">▶ 连续播放</button><button data-action="manageVocab">${view.manage?"完成管理":"管理"}</button><button data-action="vocabSettings">⚙ 设置</button></div>
<input id="vocabSearch" placeholder="搜索单词、释义、例句…" value="${esc(view.query)}">
<div id="vocabSettingsPanel" class="card hidden"><label>排序</label><select id="sortSelect"><option value="created">添加时间</option><option value="alpha">字母顺序</option><option value="pos">词类</option><option value="gender">名词性别</option></select><label>排序方向</label><select id="sortDir"><option value="desc">降序</option><option value="asc">升序</option></select></div>
${list.length?list.map(w=>`<div class="card"><div class="row spread"><button class="quiet" style="text-align:left;flex:1" data-action="wordDetail" data-id="${esc(w.id)}"><div class="row"><strong class="de">${esc(w.word)}</strong><span class="pill">${esc(w.pos)}</span></div><div class="zh">${esc(cfg.ui.showChineseInVocab?w.zh:"中文释义已隐藏")}</div></button>${speakButton(w.word)}${view.manage?`<button class="danger" data-action="deleteWord" data-id="${esc(w.id)}">删除</button>`:""}</div></div>`).join(""):empty("还没有生词，去翻译页添加第一个吧")}
${data.vocab.length>view.limit?`<button class="primary" style="width:100%" data-action="loadMore">加载更多</button>`:""}`}
function renderDetail(w){if(!w)return `${header("生词详情",`<button data-action="back">返回</button>`)}${header("生词详情",`<button data-action="back">返回</button>`)}
<section class="card"><div class="row spread"><div><div class="bigword">${esc(w.lemma||w.word||"—")}</div><div>${esc(w.zh||"—")}</div></div>${speakButton(w.word)}</div></section>

function parseJ(text){let s=String(text||"").trim().replace(/^```(?:json)?\s*/i,"").replace(/\s*```$/,"");const starts=[s.indexOf("{"),s.indexOf("[")].filter(n=>n>=0);if(starts.length){const start=Math.min(...starts);const end=Math.max(s.lastIndexOf("}"),s.lastIndexOf("]"));if(end>=start)s=s.slice(start,end+1)}try{return JSON.parse(s)}catch{throw new Error("AI 返回格式异常，请重试")}}
function isGerman(s){return /[A-Za-zÄÖÜäöüß]/.test(s)&&!(/[\u4e00-\u9fff]/.test(s))}
function aiPromptWord(word,context){return `只输出JSON，不要Markdown。为德语学习者查询词条，未知字段使用空字符串或空数组，不能编造。格式：{"lemma":"","pos":"","article":"","plural":"","genitiv":"","zh":"","explain":"","forms":{"praesens":{"ich":"","du":"","er":"","wir":"","ihr":"","sie":""},"praeteritum":{"ich":"","du":"","er":"","wir":"","ihr":"","sie":""},"perfekt":"","imperativ":"","partizipII":"","hilfsverb":"","konjunktivII":""},"adjective":{"positive":"","komparativ":"","superlativ":""},"examples":[{"de":"","zh":""},{"de":"","zh":""},{"de":"","zh":""}],"collocations":[],"pitfalls":"","synonyms":[],"antonyms":[],"note":""}. 输入词：${word}。上下文：${context||"无"}. 解释用中文，例句为B1水平。` }
async function callAI(prompt){if(!navigator.onLine)throw new Error("当前离线，无法使用云端 AI");if(!cfg.ai.apiKey)throw new Error("请先在设置中配置 AI API Key");let url,headers,body;if(cfg.ai.provider==="anthropic"){url="https://api.anthropic.com/v1/messages";headers={"content-type":"application/json","x-api-key":cfg.ai.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"};body={model:cfg.ai.model||"claude-3-5-haiku-latest",max_tokens:2500,messages:[{role:"user",content:prompt}]}}else{url=(cfg.ai.baseUrl||"https://api.deepseek.com/v1").replace(/\/+$/,"")+"/chat/completions";headers={"content-type":"application/json",authorization:"Bearer "+cfg.ai.apiKey};body={model:cfg.ai.model||"deepseek-chat",temperature:.2,messages:[{role:"system",content:"You are a precise German tutor. Output valid JSON only."},{role:"user",content:prompt}]}}
let res;try{res=await fetch(url,{method:"POST",headers,body:JSON.stringify(body)})}catch{throw new Error("无法连接（网络问题，或该服务不允许浏览器直接调用）")}if(!res.ok)throw new Error(`AI 请求失败（HTTP ${res.status}），请检查模型、密钥或服务设置`);const j=await res.json();let content=cfg.ai.provider==="anthropic"?j.content?.map(x=>x.text||"").join(""):j.choices?.[0]?.message?.content;if(!content)throw new Error("AI 返回格式异常，请重试");return parseJ(content)}
async function myMemory(text,from,to){if(!navigator.onLine)throw new Error("当前离线，无法联网翻译");const url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.slice(0,450))}&langpair=${from}|${to}`;let r;try{r=await fetch(url)}catch{throw new Error("无法连接（网络问题，或该服务不允许浏览器直接调用）")}if(!r.ok)throw new Error("翻译服务暂不可用");const j=await r.json();return j.responseData?.translatedText||""}
function validWord(raw,query,context){const w=normalizeWord(raw);w.word=w.lemma||query;w.lemma=w.lemma||query;w.zh=w.zh||"";w.pos=w.pos||"—";w.context=context;w.examples=w.examples.filter(e=>e.de||e.zh);return w}
function cacheKey(q,c){return q.trim().toLowerCase()+"|"+(c||"").trim().toLowerCase()}
function historyAdd(type,q,answer,raw){data.history.unshift({id:id("h"),type,query:q,answer,createdAt:now(),raw});data.history=data.history.slice(0,100);save()}
async function doTranslate(){const input=$("#queryText");let q=input.value.trim();if(!q)return toast("请先输入内容");if(q.length>4500){q=q.slice(0,4500);input.value=q;toast("输入过长，已截断")}const btn=$("#translateBtn");btn.disabled=true;btn.textContent="查询中…";$("#translateResult").innerHTML=`<div class="card muted">正在查询…</div>`;try{let raw;if(isGerman(q)&&q.split(/\s+/).length<=3&&!/[.!?。！？]/.test(q)){const key=cacheKey(q,"");raw=view.cache[key];if(!raw){try{const ai=await callAI(aiPromptWord(q,""));raw={type:"word",word:validWord(ai,q,""),note:ai.note||""}}catch(e){if(cfg.ai.apiKey)throw e;const zh=await myMemory(q,"de","zh-CN");raw={type:"word",word:normalizeWord({word:q,lemma:q,zh,pos:"词条",explain:"在线基础翻译结果。配置 AI 后可获取更详细的词形与用法。",examples:[]}),note:"可在设置中配置 AI 以获取完整词典信息。"}}view.cache[key]=raw;const keys=Object.keys(view.cache);if(keys.length>200)delete view.cache[keys[0]]}historyAdd("word",q,raw.word.zh||"",raw);view.historyResult=raw;$("#translateResult").innerHTML=renderResult(raw)}else{let zh;try{const r=await callAI(`只输出JSON字符串数组，长度必须为1。把以下德语/中文内容翻译成自然的中文/德语，保留原意。输入：${JSON.stringify([q])}`);if(!Array.isArray(r)||r.length!==1)throw new Error("AI 返回格式异常，请重试");zh=String(r[0])}catch(e){if(cfg.ai.apiKey)throw e;zh=await myMemory(q,isGerman(q)?"de":"zh-CN",isGerman(q)?"zh-CN":"de")}raw={type:"sentence",de:q,zh};historyAdd("sentence",q,zh,raw);view.historyResult=raw;$("#translateResult").innerHTML=renderResult(raw)}}catch(e){$("#translateResult").innerHTML=`<div class="card" role="alert"><strong>查询失败</strong><p>${esc(e.message||"操作失败")}</p><button data-action="retryTranslate">重试</button></div>`;toast(e.message||"操作失败")}finally{btn.disabled=false;btn.textContent="查询 / 翻译"}}
async function translateBatch(lines){const out=[];for(let i=0;i<lines.length;i+=15){const batch=lines.slice(i,i+15);try{const r=await callAI(`只输出JSON字符串数组，严格按输入顺序输出${batch.length}条中文翻译。输入德语句子数组：${JSON.stringify(batch)}`);if(!Array.isArray(r)||r.length!==batch.length)throw new Error("长度不匹配");out.push(...r.map(String))}catch(e){toast("AI 翻译失败，尝试基础翻译（质量较低）");for(const s of batch){try{out.push(await myMemory(s,"de","zh-CN"))}catch{out.push("")}}}}return out}
function parseImported(text){let lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(lines.length<=1&&!lines[0]?.includes("|"))lines=(text.match(/[^.!?。！？]+[.!?。！？]?/g)||[]).map(s=>s.trim()).filter(Boolean);return lines.slice(0,200).map(line=>{const p=line.split("|");return [p[0].trim(),(p.slice(1).join("|")||"").trim()] }).filter(x=>x[0])}
async function saveImport(){const title=$("#importTitle").value.trim()||"未命名主题",text=$("#importText").value.trim();if(!text)return toast("请输入要导入的文本");const lines=parseImported(text);if(!lines.length)return toast("没有识别到句子");if(lines.length>=200)toast("最多导入 200 句");const btn=$("#saveImport");btn.disabled=true;btn.textContent="保存中…";try{if($("#autoTranslate").checked){const missing=lines.map((l,i)=>l[1]?null:i).filter(x=>x!==null);const translated=await translateBatch(missing.map(i=>lines[i][0]));missing.forEach((idx,j)=>lines[idx][1]=translated[j]||"")}let t=data.importedTopics.find(x=>x.title.toLowerCase()===title.toLowerCase());let added=0;if(t){const known=new Set(t.lines.map(l=>l[0].trim().toLowerCase()));lines.forEach(l=>{if(!known.has(l[0].toLowerCase())){t.lines.push(l);known.add(l[0].toLowerCase());added++}});toast(`同名主题已合并，新增 ${added} 句`)}else{t={id:id("imp"),title,emoji:"📘",source:"import",lines};data.importedTopics.push(t);added=lines.length}save();view.page="main";tab="learn";render()}catch(e){toast(e.message||"保存失败")}finally{btn.disabled=false;btn.textContent="保存为主题"}}
function mergeGenerated(obj){if(!obj||!Array.isArray(obj.lines)||obj.lines.length!==10)throw new Error("AI 返回格式异常，请重试");return {id:id("imp"),title:String(obj.title||"AI 对话"),emoji:String(obj.emoji||"💬"),source:"ai",lines:obj.lines.map(x=>[String(x?.[0]||""),String(x?.[1]||"")]).filter(x=>x[0])}}
async function generate(){const scenario=$("#scenario").value.trim();if(!scenario)return toast("请输入学习场景");const btn=$("#generateBtn");btn.disabled=true;btn.textContent="生成中…";$("#generatedPreview").innerHTML=`<div class="card">正在生成 10 句对话…</div>`;try{const obj=await callAI(`只输出JSON：{"title":"简短中文标题","emoji":"一个emoji","lines":[["德语","中文"]]}。根据场景“${scenario}”生成恰好10句自然常用、B1水平德语对话，不标说话人，每句附中文。`);const t=mergeGenerated(obj);view.generated=t;$("#generatedPreview").innerHTML=`<section class="card"><h2>${esc(t.emoji)} ${esc(t.title)}</h2>${t.lines.map((l,i)=>`<div class="lineitem"><div class="de">${esc(l[0])}</div><div class="zh">${esc(l[1])}</div></div>`).join("")}<button class="primary" data-action="saveGenerated">保存为主题</button> <button data-action="regenerate">重新生成</button></section>`}catch(e){$("#generatedPreview").innerHTML=`<div class="card">${esc(e.message)}</div><button data-action="regenerate">重试</button>`;toast(e.message)}finally{btn.disabled=false;btn.textContent="生成对话（10句）"}}
function renderSettingsVoices(){if(!("speechSynthesis"in window))return;const voices=speechSynthesis.getVoices();for(const [idv,lang] of [["deURI","de"],["zhURI","zh"]]){const el=$("#"+idv);if(!el)continue;const prev=cfg.tts[idv]||"";el.innerHTML='<option value="">系统默认</option>'+voices.filter(v=>v.lang.toLowerCase().startsWith(lang)).map(v=>`<option value="${esc(v.voiceURI)}">${esc(v.name)} (${esc(v.lang)})</option>`).join("");el.value=prev}}
function systemSpeak(text,lang){return new Promise((resolve,reject)=>{if(!("speechSynthesis"in window))return reject(new Error("此浏览器不支持系统语音"));speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=lang.startsWith("de")?Number(cfg.ui.speechRate||.8):1;const uri=lang.startsWith("de")?cfg.tts.deURI:cfg.tts.zhURI;const voice=speechSynthesis.getVoices().find(v=>v.voiceURI===uri);if(voice)u.voice=voice;u.onend=resolve;u.onerror=()=>reject(new Error("系统语音播放失败"));speechSynthesis.speak(u)})}
function ssml(text,voice,lang){return `<speak version="1.0" xml:lang="${lang}"><voice name="${esc(voice)}">${esc(text)}</voice></speak>`}
async function azureSpeak(text,lang){const t=cfg.tts;if(!t.azureKey||!t.azureRegion)throw new Error("请配置 Azure Key 和区域");const voice=lang.startsWith("de")?t.deVoice:t.zhVoice;const key=`https://${t.azureRegion}.tts.speech.microsoft.com/cognitiveservices/v1?voice=${encodeURIComponent(voice)}&text=${encodeURIComponent(text)}`;if("caches"in window){const cache=await caches.open("dl-tts-v1");const cached=await cache.match(key);if(cached){const blob=await cached.blob();new Audio(URL.createObjectURL(blob)).play();return}}const r=await fetch(`https://${t.azureRegion}.tts.speech.microsoft.com/cognitiveservices/v1`,{method:"POST",headers:{"Ocp-Apim-Subscription-Key":t.azureKey,"Content-Type":"application/ssml+xml","X-Microsoft-OutputFormat":"riff-24khz-16bit-mono-pcm"},body:ssml(text,voice,lang)});if(!r.ok)throw new Error("Azure 语音请求失败");const blob=await r.blob();if("caches"in window){try{const cache=await caches.open("dl-tts-v1");await cache.put(key,new Response(blob,{headers:{"Content-Type":blob.type||"audio/wav"}}))}catch{}}const a=new Audio(URL.createObjectURL(blob));await a.play()}
let azureFailedNotified=false;async function speak(text,lang="de-DE"){if(!text)return;try{if(cfg.tts.engine==="azure")await azureSpeak(text,lang);else await systemSpeak(text,lang)}catch(e){if(cfg.tts.engine==="azure"){if(!azureFailedNotified){toast("Azure 语音失败，已改用系统语音");azureFailedNotified=true}try{await systemSpeak(text,lang)}catch(e2){toast(e2.message)}}else toast(e.message||"发音失败")}}
async function playTopic(tid){const t=topicById(tid);if(!t)return;view.playing=true;for(let i=0;i<t.lines.length&&view.playing;i++){view.activeLine=i;render();const el=$("#sentence-"+i);el?.scrollIntoView({block:"nearest",behavior:"smooth"});for(let n=0;n<Number(cfg.ui.repeat||1)&&view.playing;n++){try{await speak(t.lines[i][0],"de-DE");if(cfg.ui.showChineseInTopic&&t.lines[i][1])await speak(t.lines[i][1],"zh-CN")}catch{}await new Promise(r=>setTimeout(r,180))}}view.playing=false;view.activeLine=-1;render()}
function closeModal(){ $("#modalRoot").innerHTML="";view.modalWord=null}
function openModal(title,body){$("#modalRoot").innerHTML=`<div class="overlay" data-action="overlayClose"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheethead"><h2>${esc(title)}</h2><button data-action="closeModal" aria-label="关闭">✕</button></div>${body}</section></div>`}
async function lookupWord(word,context="",tid="",line=-1){view.modalWord={word,context,tid,line};const existing=data.vocab.find(v=>v.word.toLowerCase()===word.toLowerCase()||v.lemma.toLowerCase()===word.toLowerCase());openModal("查词",`<div class="card"><div class="row spread"><div class="bigword">${esc(word)}</div>${speakButton(word)}</div><p>${esc(existing?.zh||"尚未查询")}</p><div class="toolbar"><button data-action="externalDict" data-word="${esc(word)}">词典外链</button><button class="primary" data-action="contextLookup" data-word="${esc(word)}">结合上下文查义</button></div><label>中文释义</label><input id="lookupZh" value="${esc(existing?.zh||"")}" placeholder="填写中文释义"><div class="toolbar"><button class="primary" data-action="saveLookupWord">加入 / 更新生词本</button></div></div>`)}
async function contextLookup(word){const b=$('[data-action="contextLookup"]');if(b){b.disabled=true;b.textContent="查询中…"}try{const raw=await callAI(aiPromptWord(word,view.modalWord?.context||""));const w=validWord(raw,word,view.modalWord?.context||"");const old=data.vocab.find(v=>v.word.toLowerCase()===word.toLowerCase());if(old)Object.assign(old,w,{id:old.id});else view.modalWord.generated=w;const inp=$("#lookupZh");if(inp)inp.value=w.zh;toast("查词完成")}catch(e){toast(e.message)}finally{if(b){b.disabled=false;b.textContent="结合上下文查义"}}}
function openEditWord(w){openModal("编辑生词",`<input type="hidden" id="editWordId" value="${esc(w.id)}"><label>单词</label><input id="ewWord" value="${esc(w.word)}"><label>词性</label><input id="ewPos" value="${esc(w.pos)}"><label>中文释义</label><input id="ewZh" value="${esc(w.zh)}"><label>详细解释</label><textarea id="ewExplain">${esc(w.explain)}</textarea><label>冠词</label><input id="ewArticle" value="${esc(w.article)}"><label>复数</label><input id="ewPlural" value="${esc(w.plural)}"><label>第二格</label><input id="ewGenitiv" value="${esc(w.genitiv)}"><label>例句（每行德语 | 中文）</label><textarea id="ewExamples">${esc(w.examples.map(e=>e.de+" | "+e.zh).join("\n"))}</textarea><button class="primary" data-action="saveEditWord">保存</button>`)}
function reviewRate(rating){const w=dueWords()[view.reviewIndex];if(!w)return;if(rating==="remember"){w.ease=Math.max(1.3,(w.ease||2.5)+.1);w.interval=w.interval===0?1:w.interval===1?6:Math.round(w.interval*w.ease);w.due=now()+w.interval*86400000;w.reps=(w.reps||0)+1}else{w.ease=Math.max(1.3,(w.ease||2.5)-.2);w.interval=0;w.due=now()+600000}save();view.reviewFlip=false;if(view.reviewIndex>=dueWords().length)view.reviewIndex=0;render()}
function exportBackup(){const payload={mastered:data.mastered,vocab:data.vocab,importedTopics:data.importedTopics,history:data.history,deleted:data.deleted,order:data.order,sort:data.sort,updatedAt:data.updatedAt};const blob=new Blob([JSON.stringify({version:1,data:payload,config:cfg},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="deutsch-assistant-backup.json";a.click();URL.revokeObjectURL(a.href);toast("备份已导出")}
function mergeBackup(obj){const incoming=obj.data||obj;if(Array.isArray(incoming.vocab)){for(const x of incoming.vocab){const w=normalizeWord(x),old=data.vocab.find(v=>v.word.toLowerCase()===w.word.toLowerCase());if(!old)data.vocab.push(w);else if((w.due||0)>(old.due||0))Object.assign(old,w,{id:old.id})}}for(const t of incoming.importedTopics||[]){if(!data.importedTopics.some(x=>x.id===t.id)&&!data.deleted[t.id])data.importedTopics.push(t)}data.mastered={...data.mastered,...incoming.mastered};data.deleted={...data.deleted,...incoming.deleted};data.history=[...new Map([...data.history,...(incoming.history||[])].map(h=>[h.id,h])).values()].sort((a,b)=>b.createdAt-a.createdAt).slice(0,100);data.order=[...new Set([...data.order,...(incoming.order||[])])];save();toast("备份合并完成");render()}
async function syncNow(){const url=safeURL(cfg.sync.appsScriptUrl);if(!url)return toast("请先填写有效的 Apps Script 网址");const status=$("#syncStatus");if(status)status.textContent="同步中…";try{const payload={mastered:data.mastered,vocab:data.vocab,importedTopics:data.importedTopics,history:data.history,deleted:data.deleted,order:data.order,sort:data.sort,updatedAt:data.updatedAt};const r=await fetch(url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token:cfg.sync.token,action:"set",data:payload})});if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();if(!j.ok)throw new Error("同步服务返回失败");if(status)status.textContent="同步成功 · "+new Date().toLocaleTimeString();toast("同步成功")}catch(e){if(status)status.textContent="同步失败（本地数据不受影响）";toast("同步失败，请检查网络与 Apps Script 配置")}}
function handleAction(el){const a=el.dataset.action;if(!a)return;const idv=el.dataset.id,tid=el.dataset.topic,li=Number(el.dataset.line);switch(a){

case"saveEditWord":{const w=wordById($("#editWordId").value);if(!w)break;Object.assign(w,{word:$("#ewWord").value.trim(),lemma:$("#ewWord").value.trim(),pos:$("#ewPos").value.trim(),zh:$("#ewZh").value.trim(),explain:$("#ewExplain").value,article:$("#ewArticle").value,plural:$("#ewPlural").value,genitiv:$("#ewGenitiv").value,examples:$("#ewExamples").value.split(/\r?\n/).filter(Boolean).map(s=>{const p=s.split("|");return{de:(p[0]||"").trim(),zh:(p.slice(1).join("|")||"").trim()}})});save();closeModal();render();toast("已保存");break}
case"manageVocab":view.manage=!view.manage;render();break;case"vocabSettings":$("#vocabSettingsPanel").classList.toggle("hidden");break;case"loadMore":view.limit+=100;render();break;case"review":view.page="review";view.reviewIndex=0;view.reviewFlip=false;render();break;case"flipReview":view.reviewFlip=!view.reviewFlip;render();break;case"rateReview":reviewRate(el.dataset.rating);break;

case"externalDict":{const word=el.dataset.word,url=cfg.dict.customUrl.includes("{w}")?cfg.dict.customUrl.replaceAll("{w}",encodeURIComponent(word)):"https://www.duden.de/rechtschreibung/"+encodeURIComponent(word);const safe=safeURL(url);if(safe)window.open(safe,"_blank","noopener,noreferrer");else toast("词典网址无效");break}
case"contextLookup":contextLookup(el.dataset.word);break;
case"saveLookupWord":{const m=view.modalWord;if(!m)break;const raw=m.generated||normalizeWord({word:m.word,lemma:m.word,pos:"词条",zh:$("#lookupZh").value,context:m.context,examples:[]});raw.zh=$("#lookupZh").value.trim()||raw.zh;raw.context=m.context;addWord(raw,m.context);closeModal();break}
case"editLine":{const t=topicById(tid);if(t){view.editLine={topic:tid,index:li,de:t.lines[li][0],zh:t.lines[li][1]};view.page="topicEdit";render()}break}
case"saveLine":{const t=topicById(view.editLine.topic);if(t){t.lines[view.editLine.index]=[$("#editDe").value,$("#editZh").value];save();view.page="topic";render()}break}
case"moveLine":{const t=topicById(tid),to=li+Number(el.dataset.dir);if(t&&to>=0&&to<t.lines.length){[t.lines[li],t.lines[to]]=[t.lines[to],t.lines[li]];save();render()}break}
case"masterLine":{const key=tid+"_"+li;if(data.mastered[key])delete data.mastered[key];else data.mastered[key]=1;save();render();break}
case"deleteLine":if(confirm("确定删除这句？")){const t=topicById(tid);if(t){t.lines.splice(li,1);save();render()}}break;
case"deleteTopic":if(confirm("确定删除该导入主题？")){data.deleted[idv]=true;data.importedTopics=data.importedTopics.filter(t=>t.id!==idv);save();render()}break;
case"saveGenerated":{const t=view.generated;if(!t)break;const old=data.importedTopics.find(x=>x.title.toLowerCase()===t.title.toLowerCase());if(old){const known=new Set(old.lines.map(l=>l[0].toLowerCase()));t.lines.forEach(l=>{if(!known.has(l[0].toLowerCase()))old.lines.push(l)});toast("同名主题已合并")}else data.importedTopics.push(t);save();view.page="main";tab="learn";render();break}
case"regenerate":generate();break;
case"installPWA":if(view.installPrompt){view.installPrompt.prompt();view.installPrompt.userChoice.then(r=>toast(r.outcome==="accepted"?"已开始安装":"已取消安装"));view.installPrompt=null;render()}else toast("请使用浏览器菜单中的“添加到主屏幕”");break;
case"restoreTopics":if(confirm("恢复内置主题？")){data.deleted={};save();render();toast("已恢复内置主题")}break;

async function aiMore(wid,examplesOnly){const w=wordById(wid);if(!w)return;if(!cfg.ai.apiKey)return toast("请先在设置中配置 AI API Key");view.aiBusy=true;render();try{const obj=await callAI(examplesOnly?`只输出JSON数组，给德语词“${w.word}”生成3条B1例句，每项{"de":"","zh":""}。`:`只输出JSON对象，为德语词“${w.word}”提供2-5句中文详细解释、常见搭配、易错点、同义词、反义词、至少3条B1例句，字段 explain,collocations,pitfalls,synonyms,antonyms,examples。`);if(examplesOnly){if(!Array.isArray(obj))throw new Error("AI 返回格式异常，请重试");w.examples=[...w.examples,...obj.map(x=>({de:String(x.de||""),zh:String(x.zh||"")}))].slice(-12)}else{w.explain=String(obj.explain||w.explain);w.collocations=obj.collocations||w.collocations;w.pitfalls=String(obj.pitfalls||w.pitfalls);w.synonyms=obj.synonyms||w.synonyms;w.antonyms=obj.antonyms||w.antonyms;w.examples=obj.examples||w.examples}save();toast("内容已更新")}catch(e){toast(e.message)}finally{view.aiBusy=false;render()}}
function initEvents(){document.addEventListener("click",e=>{const tabBtn=e.target.closest("[data-tab]");if(tabBtn){setTab(tabBtn.dataset.tab);return}const el=e.target.closest("[data-action]");if(el){handleAction(el);return}if(e.target.id==="translateBtn")doTranslate();if(e.target.id==="saveImport")saveImport();if(e.target.id==="generateBtn")generate();if(e.target.id==="saveAI"){cfg.ai.provider=$("#provider").value;cfg.ai.baseUrl=$("#baseUrl").value.trim();cfg.ai.model=$("#model").value.trim();cfg.ai.apiKey=$("#apiKey").value;saveCfg()}if(e.target.id==="testAI")testAI();if(e.target.id==="saveTTS"){cfg.tts.engine=$("#ttsEngine").value;cfg.tts.deURI=$("#deURI").value;cfg.tts.zhURI=$("#zhURI").value;cfg.tts.deVoice=$("#deVoice")?.value==="custom"?$("#deCustom").value:($("#deVoice")?.value||cfg.tts.deVoice);cfg.tts.zhVoice=$("#zhVoice")?.value==="custom"?$("#zhCustom").value:($("#zhVoice")?.value||cfg.tts.zhVoice);cfg.tts.azureKey=$("#azureKey")?.value||"";cfg.tts.azureRegion=$("#azureRegion")?.value||"";cfg.ui.speechRate=Number($("#speechRate").value);saveCfg();speak("Guten Tag","de-DE")}if(e.target.id==="saveAppearance"){cfg.theme=$("#theme").value;cfg.dict.customUrl=$("#dictUrl").value.trim();saveCfg()}if(e.target.id==="syncNow")syncNow()});
document.addEventListener("input",e=>{if(e.target.id==="vocabSearch"){view.query=e.target.value;const pos=e.target.selectionStart;render();const n=$("#vocabSearch");n?.focus();n?.setSelectionRange(pos,pos)}if(e.target.id==="topicSearchInput"){const q=e.target.value.toLowerCase();$$("#sentenceList article").forEach(el=>el.classList.toggle("hidden",!el.textContent.toLowerCase().includes(q)))}});
document.addEventListener("change",e=>{if(e.target.id==="textFile"){const f=e.target.files?.[0];if(f){const r=new FileReader();r.onload=()=>$("#importText").value=String(r.result||"").slice(0,100000);r.readAsText(f)}}if(e.target.id==="backupFile"){const f=e.target.files?.[0];if(f){const r=new FileReader();r.onload=()=>{try{mergeBackup(JSON.parse(r.result))}catch{toast("备份文件格式错误")}};r.readAsText(f)}}
if(e.target.id==="preset"){const p=e.target.value;const presets={deepseek:["https://api.deepseek.com/v1","deepseek-chat","openai"],openai:["https://api.openai.com/v1","gpt-4o-mini","openai"],qwen:["https://dashscope.aliyuncs.com/compatible-mode/v1","qwen-plus","openai"],gemini:["https://generativelanguage.googleapis.com/v1beta/openai","gemini-2.0-flash","openai"]};const v=presets[p];$("#baseUrl").value=v[0];$("#model").value=v[1];$("#provider").value=v[2]}
if(e.target.id==="ttsEngine"){$("#azureVoices").classList.toggle("hidden",e.target.value!=="azure");$("#systemVoices").classList.toggle("hidden",e.target.value==="azure")}
if(e.target.id==="deVoice")$("#deCustomWrap").classList.toggle("hidden",e.target.value!=="custom");if(e.target.id==="zhVoice")$("#zhCustomWrap").classList.toggle("hidden",e.target.value!=="custom");
if(e.target.id==="theme"){cfg.theme=e.target.value;applyTheme()}
if(e.target.id==="repeatSetting"){cfg.ui.repeat=Number(e.target.value);save()}if(e.target.id==="showChinese"){cfg.ui.showChineseInTopic=e.target.checked;save();render()}if(e.target.id==="showMastered"){cfg.ui.showMastered=e.target.checked;save();render()}if(e.target.id==="topicRate"){cfg.ui.speechRate=Number(e.target.value);save()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if((e.ctrlKey||e.metaKey)&&e.key==="Enter"&&$("#queryText"))doTranslate()})}
async function testAI(){const b=$("#testAI");b.disabled=true;b.textContent="测试中…";try{const r=await callAI('只输出JSON对象：{"ok":true,"message":"连接成功"}');if(!r.ok)throw new Error("测试响应异常");toast("AI 连接成功")}catch(e){toast(e.message)}finally{b.disabled=false;b.textContent="测试 AI"}}
function initPWA(){window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();view.installPrompt=e;const b=$("#installBtn");if(b)b.disabled=false});window.addEventListener("appinstalled",()=>toast("德语助手已安装"));window.addEventListener("online",()=>toast("网络已恢复"));window.addEventListener("offline",()=>toast("当前离线，云端服务不可用"));if("serviceWorker"in navigator&&location.protocol!=="file:"){const sw=`const C='de-assistant-shell-v1';self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll([self.location.href.split('#')[0]]).catch(()=>{})).then(()=>self.skipWaiting())));self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(fetch(e.request).then(r=>{if(r.ok&&new URL(e.request.url).origin===location.origin){const copy=r.clone();caches.open(C).then(c=>c.put(e.request,copy))}return r}).catch(()=>caches.match(e.request).then(r=>r||caches.match(self.location.href.split('#')[0]))))});self.addEventListener('message',e=>{if(e.data==='SKIP_WAITING')self.skipWaiting()});`;try{const blob=new Blob([sw],{type:"text/javascript"});const url=URL.createObjectURL(blob);navigator.serviceWorker.register(url).then(reg=>{view.swReg=reg;if(reg.waiting){toast("有新版本可用");$("#toast").onclick=()=>{reg.waiting.postMessage("SKIP_WAITING");location.reload()}}reg.addEventListener("updatefound",()=>{const w=reg.installing;w?.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller){toast("有新版本可用");$("#toast").onclick=()=>location.reload()}})})}).catch(()=>{})}catch{}}
}
load();applyTheme();initEvents();initPWA();render();if("speechSynthesis"in window){renderSettingsVoices();speechSynthesis.onvoiceschanged=renderSettingsVoices}
})();
