function setMode(k,on){const m=modes();m[k]=!!on;if(!Object.keys(m).some(x=>m[x])){m.q=1;toast('至少保留一种学习方式')}KS.modes=m;save();return m}
const modeHtml=()=>MODE_LIST.map(([k,_,t])=>'<label class="c"><input type="checkbox" data-a="kidmode" data-m="'+k+'"'+(modes()[k]?' checked':'')+'>'+t+'</label>').join('');
function home(){sid++;SES++;try{stopAudio()}catch(e){}
  const bid=selBook();if(KS.bk!=='*'&&!D.books.find(b=>b.id===KS.bk))KS.bk=bid;
  const p=pick(bid),ne=errCount(bid),bn=bid==='*'?'全部生词本':((D.books.find(b=>b.id===bid)||{}).name||'—');
  const mt=modes(),ml=MODE_LIST.filter(([k])=>mt[k]).map(x=>x[1]).join(' → ');
  el.innerHTML='<div class="kt"><button id="kx">✕</button><div class="kst">⭐ '+KS.st.stars+' · 🔥 连续 '+KS.st.streak+' 天</div></div><div class="kb"><div class="hd">Wörter üben</div><div class="kgl">'+ring()+'</div><div class="msg">'+(p.n?(p.practice?'今天的都练完啦，可以加练':'今天要练 '+p.L.length+' 个词'):'这个本子里还没有可练的词（需要有中文释义的单个德语词）')+'</div><div class="row"><button class="p" id="kgo"'+(p.n?'':' disabled')+'>开始</button><button id="klook">🔍 查词</button></div><div class="row"><button id="kbd">🏅 徽章 '+Object.keys(KS.bd).length+'/'+BG.length+'</button><button id="kerr"'+(ne?'':' disabled')+'>📕 错词本（'+ne+'）</button></div><div class="row"><button class="sm" id="kfx">缓存本册德语发音（需在设置里启用 Azure）</button></div><div class="sm2">本轮学习：'+esc(ml||'未选择（请在设置里勾选）')+'</div><div class="sm2">练习生词本：'+esc(bn)+'（在 设置 → 儿童模式 中更改）</div></div>';
  el.onclick=e=>{if(!el.contains(e.target))return;const t=e.target.closest('button');if(!t)return;
    if(t.id==='kx')return quit();
    if(t.id==='kfx')return precache(words(bid).map(w=>[w.de,'de']));
    if(t.id==='kbd')return wall();
    if(t.id==='klook')return klook();
    if(t.id==='kgo')start(p);if(t.id==='kerr')start(pickErr())}}
function start(p){SES++;const tok=SES;ws=p.L||[];Q=[];miss={};qi=0;AX=0;QRAN=false;STAR0=KS.st.stars;
  const pl=ws.map(plan);POOL=p.pool||[];ERR=!!p.err;EV=[];ST=Date.now();
  for(let r=0;r<4;r++)ws.forEach((w,i)=>{if(pl[i][r])Q.push([w,pl[i][r]])});
  const m=modes(),pool=words(selBook()),gw=ws.length?ws:pool;ACTS=[];
  const hasSyl=(ws.some(w=>syl(w.de).length>1)||pool.some(w=>syl(w.de).length>1)),hasArt=(ws.some(w=>w.art)||pool.some(w=>w.art));
  if(p.err){if(Q.length)ACTS.push('q')}
  else{if(m.q&&Q.length)ACTS.push('q');if(m.memo&&(ws.length>=3||pool.length>=3))ACTS.push('memo');if(m.clap&&gw.length)ACTS.push('clap');
    if(m.syl&&hasSyl)ACTS.push('syl');if(m.hear&&gw.length)ACTS.push('hear');if(m.sort&&hasArt)ACTS.push('sort')}
  if(!ACTS.length)return toast('请在 设置 → 儿童模式 里选择至少一种学习方式');
  sid++;font().then(()=>{if(tok===SES)runAct(tok)})}
function runAct(tok){if(tok!==SES)return;const a=ACTS[AX++];if(!a)return done();
  if(a==='q'){QRAN=true;EV=[];miss={};qi=0;ST=Date.now();return step()}
  const pool=words(selBook()),gw=ws.length?ws:pool;
  if(a==='memo'){const mp=ws.length>=3?ws:pool;if(mp.length<3)return runAct(tok);return memo(mp,()=>runAct(tok))}
  if(a==='clap'){if(!gw.length)return runAct(tok);return clap(gw,()=>runAct(tok))}
  if(a==='syl'){const mp=ws.filter(w=>syl(w.de).length>1).length>=3?ws:pool;if(!mp.some(w=>syl(w.de).length>1))return runAct(tok);return sylPlay(mp,()=>runAct(tok))}
  if(a==='hear'){if(!gw.length)return runAct(tok);return hearPlay(gw,pool,()=>runAct(tok))}
  if(a==='sort'){const mp=ws.filter(w=>w.art).length>=3?ws:pool;if(!mp.some(w=>w.art))return runAct(tok);return artSort(mp,()=>runAct(tok))}}
function step(){if(qi>=Q.length)return runAct(SES);const[w,m]=Q[qi],my=sid;bad=0;el.onclick=null;
  el.innerHTML='<div class="kt"><button id="kx">✕</button><div class="bar"><i style="width:'+qi/Q.length*100+'%"></i></div></div><div class="kb" id="kb"></div>';
  el.querySelector('#kx').onclick=()=>{if(confirm('先退出这次练习吗？本次进度不保存'))home()};
  const box=el.querySelector('#kb');({trace,trace0:trace,dictE:dict,dictZ:dict,spellE:spell,spellZ:spell,pickE:kpick,art:kart,gap:kgap})[m](w,m,box,my)}
function pass(box,my){logQ();box.insertAdjacentHTML('beforeend','<div class="star">⭐</div>');setTimeout(()=>{if(my===sid){qi++;step()}},900)}

/* ---- 四线格 ---- */
const gw=()=>'<div class="gw"><canvas></canvas><canvas></canvas><canvas class="ca"></canvas></div>';
function grid(x){x.lineWidth=2;[[0,'#aab2b8',[]],[1,'#6fa3d8',[10,8]],[2,'#d6483c',[]],[3,'#aab2b8',[]]].forEach(([i,c,d])=>{x.strokeStyle=c;x.setLineDash(d);x.beginPath();x.moveTo(20,LY[i]);x.lineTo(W-20,LY[i]);x.stroke()});x.setLineDash([])}
function layout(t){const x=mk().getContext('2d');let fs=110;x.font=fs+'px '+FF;let m=x.measureText(t).width;if(m>840){fs=Math.floor(fs*840/m);x.font=fs+'px '+FF;m=x.measureText(t).width}return{fs,x0:(W-m)/2}}
/* lvl0 全描红；lvl1 首字母描红+其余虚线；lvl2 全虚线 */
function ghost(x,t,lvl,col){const L=layout(t);x.save();x.font=L.fs+'px '+FF;x.textAlign='left';x.textBaseline='alphabetic';x.fillStyle=x.strokeStyle=col;
  if(lvl===0)x.fillText(t,L.x0,LY[2]);else{x.lineWidth=2;x.setLineDash([7,7]);x.strokeText(t,L.x0,LY[2]);x.setLineDash([]);if(lvl===1)x.fillText(t[0],L.x0,LY[2])}x.restore()}
function ink(c){const x=cv(c);x.lineWidth=14;x.lineCap=x.lineJoin='round';x.strokeStyle=getComputedStyle(document.body).getPropertyValue('--pr').trim()||'#1f5f8b';
  let last=null;const P=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
  const seg=p=>{x.beginPath();x.moveTo(...last);x.lineTo(...p);x.stroke();last=p};
  c.onpointerdown=e=>{if(e.pointerType==='pen')pen=true;if(pen&&e.pointerType==='touch')return;e.preventDefault();c.setPointerCapture(e.pointerId);last=P(e);x.beginPath();x.moveTo(...last);x.lineTo(last[0]+.1,last[1]);x.stroke()};
  c.onpointermove=e=>{if(!last||(pen&&e.pointerType==='touch'))return;(e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>seg(P(ev)))};
  c.onpointerup=c.onpointercancel=()=>{last=null};
  return{cv:c,clear:()=>x.clearRect(0,0,W,H)}}
// 覆盖率=字形被笔迹盖住的比例；出界率=笔迹落在字形外扩范围之外的比例
function score(t,c){const L=layout(t),g=mk(),d=mk(),u=mk(),gx=g.getContext('2d'),dx=d.getContext('2d'),ux=u.getContext('2d');ux.drawImage(c,0,0,W,H);
  for(const x of[gx,dx]){x.font=L.fs+'px '+FF;x.textAlign='left';x.fillText(t,L.x0,LY[2])}dx.lineWidth=44;dx.lineJoin='round';dx.strokeText(t,L.x0,LY[2]);
  const G=gx.getImageData(0,0,W,H).data,D=dx.getImageData(0,0,W,H).data,U=ux.getImageData(0,0,W,H).data;let gt=0,gh=0,ut=0,uo=0;
  for(let i=3;i<G.length;i+=4){const a=G[i]>60,b=U[i]>60;if(a){gt++;if(b)gh++}if(b){ut++;if(D[i]<=60)uo++}}
  return{cov:gt&&ut?gh/gt:0,out:ut?uo/ut:1}}

function trace(w,m,box,my){const k=ks(w.id),lvl=m==='trace0'?0:Math.min(2,k.tl||0),hint=['沿着灰色的字描一遍','首字母描红，后面沿着虚线写','沿着虚线把单词写出来'][lvl];
  box.innerHTML='<div class="hd">'+chip(w)+'<b>'+esc(w.de)+'</b><span>'+esc(w.zh)+'</span></div>'+gw()+'<div class="msg" id="msg">'+hint+'</div><div class="row"><button id="sp">🔊 听</button><button id="cl">重写</button><button class="p" id="ok">写好了</button></div>';
  const cs=box.querySelectorAll('canvas'),b=cv(cs[0]);grid(b);ghost(b,w.de,lvl,'rgba(140,150,160,.5)');
  const q=s=>box.querySelector(s),pad=ink(cs[1]);let tries=0;q('#sp').onclick=()=>say(w.de,'de');q('#cl').onclick=pad.clear;say(w.de,'de');
  q('#ok').onclick=()=>{const r=score(w.de,pad.cv);
    if((r.cov>=.5&&r.out<=.45)||tries>=2){q('#ok').disabled=true;if(tries>0)bad=1;if(m==='trace'&&tries===0)k.tl=Math.min(2,(k.tl||0)+1);pass(box,my)}
    else{tries++;q('#msg').textContent=r.cov<.5?'再写完整一点':'写在格子里的字上面哦';pad.clear()}}}

/* 四线格默写：自检（看答案叠加在自己的字迹上，自己或家长判断对错） */
function dict(w,m,box,my){const ear=m==='dictE';
  box.innerHTML=(ear?'<div class="hd"><button class="p" id="sp">🔊 听一听，写下来</button></div>':'<div class="hd">'+chip(w)+'<b>'+esc(w.zh)+'</b></div>')+gw()+'<div class="msg" id="msg">在四线格里写出德语单词</div><div class="row" id="ctl"><button id="cl">重写</button><button class="p" id="ksh">看答案</button></div>';
  const cs=box.querySelectorAll('canvas'),q=s=>box.querySelector(s);grid(cv(cs[0]));const pad=ink(cs[1]);
  if(ear){q('#sp').onclick=()=>say(w.de,'de');say(w.de,'de')}q('#cl').onclick=pad.clear;
  q('#ksh').onclick=()=>{ghost(cv(cs[2]),w.de,0,'rgba(46,125,79,.5)');cs[1].onpointerdown=null;say(w.de,'de');
    q('#msg').innerHTML='正确答案：<b>'+(w.art?w.art+' ':'')+esc(w.de)+'</b>　和你写的一样吗？';
    q('#ctl').innerHTML='<button class="p" id="y">✅ 一样，写对了</button><button id="n">🔁 不一样</button>';
    q('#y').onclick=()=>{q('#ctl').remove();pass(box,my)};
    q('#n').onclick=()=>{mis(w);logQ();Q.splice(qi+1,0,[w,'trace0']);qi++;step()}}}   // 写错：马上描红一遍

/* 点字母拼写：spellE 听音；spellZ 看中文 */
function spell(w,m,box,my){const L=[...w.de];let pool=shuf(L.map(c=>({c,u:false}))),ans=[],lock=false;
  const draw=()=>{box.innerHTML=(m==='spellE'?'<div class="hd"><button class="p" id="sp">🔊 听一听，拼出来</button></div>':'<div class="hd">'+chip(w)+'<b>'+esc(w.zh)+'</b></div>')
    +'<div class="slots" id="ksl">'+L.map((_,i)=>ans[i]?'<button class="tile s" data-a="'+i+'">'+esc(ans[i].c)+'</button>':'<button class="tile e" disabled></button>').join('')+'</div><div class="pool">'+pool.map((p,i)=>'<button class="tile'+(p.u?' u':'')+'" data-p="'+i+'">'+esc(p.c)+'</button>').join('')+'</div>';
    const sp=box.querySelector('#sp');if(sp)sp.onclick=()=>say(w.de,'de')};
  box.onclick=e=>{if(lock)return;const t=e.target.closest('button');if(!t)return;
    if(t.dataset.p!==undefined){const p=pool[+t.dataset.p];if(p.u)return;p.u=true;ans.push(p)}else if(t.dataset.a!==undefined)ans.splice(+t.dataset.a,1)[0].u=false;else return;
    draw();if(ans.length===L.length){
      if(ans.map(p=>p.c).join('')===w.de){lock=true;say(w.de,'de');pass(box,my)}
      else{mis(w);lock=true;box.querySelector('#ksl').classList.add('shake');setTimeout(()=>{if(my!==sid)return;pool.forEach(p=>p.u=false);ans=[];lock=false;draw()},600)}}};
  draw();if(m==='spellE')say(w.de,'de')}

/* ---- 第3批：听音选词 / 冠词 / 挖空 ---- */
function kpick(w,m,box,my){const others=shuf(POOL.filter(x=>x.id!==w.id&&x.zh!==w.zh)).slice(0,3);
  if(!others.length)return spell(w,'spellE',box,my);const opts=shuf([w,...others]);let lock=false;
  box.innerHTML='<div class="hd"><button class="p" id="sp">🔊 听一听，是什么意思？</button></div><div class="row" id="op">'+opts.map((o,i)=>'<button class="kopt" data-i="'+i+'">'+esc(o.zh)+'</button>').join('')+'</div>';
  box.querySelector('#sp').onclick=()=>say(w.de,'de');say(w.de,'de');
  box.querySelector('#op').onclick=e=>{const t=e.target.closest('button');if(!t||lock||t.disabled)return;
    if(opts[+t.dataset.i]===w){lock=true;t.classList.add('ok');say(w.de,'de');pass(box,my)}else{mis(w);t.disabled=true;t.classList.add('bad')}}}
function kart(w,m,box,my){let lock=false;
  box.innerHTML='<div class="hd"><span style="font-size:48px">___ <b>'+esc(w.de)+'</b></span><span>'+esc(w.zh)+'</span></div><div class="msg">它是 der、die 还是 das？</div><div class="row" id="op">'+['der','die','das'].map(a=>'<button class="kopt kart" data-a="'+a+'" style="background:'+COL[a]+'">'+a+'</button>').join('')+'</div>';
  box.querySelector('#op').onclick=e=>{const t=e.target.closest('button');if(!t||lock||t.disabled)return;
    if(t.dataset.a===w.art){lock=true;box.querySelector('.hd span').innerHTML='<b style="color:'+COL[w.art]+'">'+w.art+'</b> <b>'+esc(w.de)+'</b>';say(w.art+' '+w.de,'de');pass(box,my)}else{mis(w);t.disabled=true}}}
// 挖空：优先挖 ä ö ü ß，其次易错字母组合（ie ei eu au ch ck 双写），再其次元音；干扰项含易混字母（a/ä、s/ß 等）
function kgap(w,m,box,my){const L=[...w.de],lw=w.de.toLowerCase();let hid=[0];
  if(L.length>1){const c1=[],c2=[],c3=[],c4=[];
    L.forEach((c,i)=>{if(!i)return;if(/[äöüß]/i.test(c))c1.push(i);else if(/[aeiou]/i.test(c))c3.push(i);else c4.push(i)});
    const re=/ie|ei|eu|au|ch|ck|ss|ll|tt|mm|nn/g;let r;while((r=re.exec(lw))){[r.index,r.index+1].forEach(i=>{if(i>0&&!c1.includes(i))c2.push(i)});re.lastIndex=r.index+1}
    hid=[...new Set([...shuf(c1),...shuf(c2),...shuf(c3),...shuf(c4)])].slice(0,L.length>=6?2:1).sort((a,b)=>a-b)}
  const need=hid.map(i=>L[i]),CF={a:'ä',ä:'a',o:'ö',ö:'o',u:'ü',ü:'u',s:'ß',ß:'s',i:'e',e:'i',t:'d',d:'t',b:'p',p:'b',g:'k',k:'g'},ds=[];
  need.forEach(c=>{const f=CF[c.toLowerCase()];if(f&&!need.includes(f)&&!ds.includes(f))ds.push(f)});
  shuf([...'aeiouäöüßsnrtlmhcdgb']).forEach(c=>{if(ds.length<3&&!need.includes(c)&&!ds.includes(c))ds.push(c)});
  const pool=shuf([...need,...ds.slice(0,3)].map(c=>({c,u:false})));let ans=[],lock=false;
  const draw=()=>{box.innerHTML='<div class="hd">'+chip(w)+'<b>'+esc(w.zh)+'</b><button id="sp">🔊</button></div><div class="slots" id="ksl">'+L.map((c,i)=>{const k=hid.indexOf(i);return k<0?'<span class="tile f">'+esc(c)+'</span>':ans[k]?'<button class="tile s" data-a="'+k+'">'+esc(ans[k].c)+'</button>':'<button class="tile e" disabled></button>'}).join('')+'</div><div class="pool">'+pool.map((p,i)=>'<button class="tile'+(p.u?' u':'')+'" data-p="'+i+'">'+esc(p.c)+'</button>').join('')+'</div>';box.querySelector('#sp').onclick=()=>say(w.de,'de')};
  box.onclick=e=>{if(lock)return;const t=e.target.closest('button');if(!t)return;
    if(t.dataset.p!==undefined){const p=pool[+t.dataset.p];if(p.u)return;p.u=true;ans.push(p)}else if(t.dataset.a!==undefined)ans.splice(+t.dataset.a,1)[0].u=false;else return;
    draw();if(ans.length===hid.length){
      if(ans.every((p,k)=>p.c===L[hid[k]])){lock=true;say(w.de,'de');pass(box,my)}
      else{mis(w);lock=true;box.querySelector('#ksl').classList.add('shake');setTimeout(()=>{if(my!==sid)return;pool.forEach(p=>p.u=false);ans=[];lock=false;draw()},600)}}};
  draw()}
/* 错词本：做错的词进入错词本，之后连续 2 次练习全对才移出 */
const errCount=bid=>words(bid).filter(w=>KS.w[w.id]&&KS.w[w.id].mx).length;
function pickErr(){const all=words(selBook());return{L:shuf(all.filter(w=>KS.w[w.id]&&KS.w[w.id].mx)).slice(0,CAP),n:all.length,practice:true,err:true,pool:all}}

/* ---- 第4批：配对游戏 / 音节拍手 / 家长验证 / 同步与备份 ---- */
const quit=async()=>{if(await gate())close()};
function endScr(t,sub,again,nb,next){el.onclick=null;el.innerHTML='<div class="kt"><button id="kx">✕</button></div><div class="kb"><div class="hd">'+t+'</div><div class="star">⭐</div><div class="msg">'+sub+'</div>'+(nb||[]).map(b=>'<div class="msg">🏅 新徽章：'+b[1]+' '+b[2]+'</div>').join('')+'<div class="row">'+(next?'<button class="p" id="nx">继续</button>':'')+'<button'+(next?'':' class="p"')+' id="ag">再玩一次</button><button id="bk">返回</button></div></div>';const q=s=>el.querySelector(s);q('#kx').onclick=home;q('#bk').onclick=home;q('#ag').onclick=again;if(next)q('#nx').onclick=next}
const award=(k,x)=>{KS.st.stars++;KS.st.t=Date.now();KS.rec.push(Object.assign({t:Date.now(),k},x));if(k==='c')KS.bs.cl=(KS.bs.cl||0)+1;if(k==='m')KS.bs.mb=Math.min(KS.bs.mb||99,x.mv);const nb=badges();trim();save();return nb};
/* 配对记忆：德语 ↔ 中文，6 对 */
function memo(pool,next){const all=(pool&&pool.length?pool:words(selBook()));if(all.length<3)return toast('至少需要 3 个词才能玩');
  const cards=shuf(shuf(all).slice(0,6).flatMap(w=>[{id:w.id,k:'d',t:(w.art?w.art+' ':'')+w.de,w},{id:w.id,k:'z',t:w.zh,w}])).map(c=>({...c,s:0}));
  let sel=[],moves=0,lock=false;const my=++sid,t0=Date.now();
  const draw=()=>{el.innerHTML='<div class="kt"><button id="kx">✕</button><div class="kst">步数 '+moves+'</div></div><div class="kb"><div class="hd">找一找：德语 ↔ 中文</div><div class="kcg">'+cards.map((c,i)=>'<button class="kcard s'+c.s+'" data-i="'+i+'"'+(c.s===2?' disabled':'')+'>'+(c.s?esc(c.t):'❓')+'</button>').join('')+'</div></div>';
    el.querySelector('#kx').onclick=home;
    el.onclick=e=>{const t=e.target.closest('.kcard');if(!t||lock||my!==sid)return;const c=cards[+t.dataset.i];if(c.s)return;c.s=1;sel.push(c);if(c.k==='d')say(c.w.de,'de');
      if(sel.length===2){moves++;const[a,b]=sel;
        if(a.id===b.id&&a.k!==b.k){a.s=b.s=2;sel=[];if(cards.every(x=>x.s===2)){const nb=award('m',{dur:Math.round((Date.now()-t0)/1000),mv:moves});return endScr('全部找到啦！','用了 '+moves+' 步',()=>memo(pool,next),nb,next)}}
        else{lock=true;draw();return void setTimeout(()=>{if(my!==sid)return;a.s=b.s=0;sel=[];lock=false;draw()},900)}}
